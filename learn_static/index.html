{id:'volcano-1',r:'volcano',t:'분모가 다른 분수의 덧셈과 뺄셈',goal:'통분해서 분모가 다른 분수를 더하고 빼요.',
 comic:[N(`분수 화산 아래 온천. 물통에 물을 ${fr(1,2)}통 붓고 ${fr(1,3)}통 더 부었어요.`),
  T('happy',`${fr(1,2)} + ${fr(1,3)} = ${fr(2,5)}! 위끼리, 아래끼리!`),
  S('oops',`분모가 다르면 조각 크기가 달라서 바로 못 더해. 6으로 통분하면 ${fr(3,6)} + ${fr(2,6)} = ${fr(5,6)}!`),
  SC(`${bar(6,3,{w:200,h:34})}${bar(6,2,{w:200,h:34})}`,`${fr(3,6)}과 ${fr(2,6)}`),
  H('think','통분하면 조각 크기가 같아지는구나!'),
  S('happy',`빼기도 똑같아. ${fr(1,2)} − ${fr(1,3)} = ${fr(3,6)} − ${fr(2,6)} = ${fr(1,6)}`)],
 widget:'unlike',
 quiz:()=>{
  const pick2=sum=>{let d1,d2,n1,n2,ok;do{d1=ri(2,9);d2=ri(2,9);n1=ri(1,d1-1);n2=ri(1,d2-1);ok=d1!==d2&&gcd(n1,d1)===1&&gcd(n2,d2)===1&&(sum?n1*d2+n2*d1<d1*d2:n1*d2>n2*d1);}while(!ok);return [n1,d1,n2,d2];};
  const a=()=>{const [n1,d1,n2,d2]=pick2(true),L=lcm(d1,d2),s=n1*L/d1+n2*L/d2,[rn,rd]=red(s,L);return frq(`<p class="big">${fr(n1,d1)} + ${fr(n2,d2)} = □</p><p>기약분수로 나타내세요.</p>`,rn,rd,`${d1}과(와) ${d2}의 최소공배수 ${L}(으)로 통분해 봐.`,`${fr(n1*L/d1,L)} + ${fr(n2*L/d2,L)} = ${fr(s,L)}${rd!==L?` = ${fr(rn,rd)}`:''}`);};
  const b=()=>{const [n1,d1,n2,d2]=pick2(false),L=lcm(d1,d2),s=n1*L/d1-n2*L/d2,[rn,rd]=red(s,L);return frq(`<p class="big">${fr(n1,d1)} − ${fr(n2,d2)} = □</p><p>기약분수로 나타내세요.</p>`,rn,rd,`먼저 ${L}(으)로 통분해.`,`${fr(n1*L/d1,L)} − ${fr(n2*L/d2,L)} = ${fr(s,L)}${rd!==L?` = ${fr(rn,rd)}`:''}`);};
  const c=()=>{const [n1,d1,n2,d2]=pick2(true),L=lcm(d1,d2),s=n1*L/d1+n2*L/d2,[rn,rd]=red(s,L);return frq(`${ttungSays(`${fr(n1,d1)} + ${fr(n2,d2)} = ${fr(n1+n2,d1+d2)}! 분자끼리, 분모끼리!`)}<p>바르게 계산해서 기약분수로 나타내면?</p>`,rn,rd,'분모가 다르면 먼저 통분해야 해.',`${fr(n1*L/d1,L)} + ${fr(n2*L/d2,L)} = ${fr(rn,rd)}`);};
  const fracs=()=>{let d1,d2,n1,n2;do{d1=ri(2,6);d2=ri(2,6);n1=ri(1,d1-1);n2=ri(1,d2-1);}while(d1===d2||gcd(n1,d1)!==1||gcd(n2,d2)!==1);return [n1,d1,n2,d2];};
  const e=()=>{let n1,d1,n2,d2,L,s;do{[n1,d1,n2,d2]=fracs();L=lcm(d1,d2);s=n1*L/d1+n2*L/d2;}while(s<=L);const w1=ri(1,3),w2=ri(1,3),[rn,rd]=red(s-L,L);return mxq(`<p class="big">${mixed(w1,n1,d1)} + ${mixed(w2,n2,d2)} = □</p><p>대분수로 나타내세요. (기약분수로)</p>`,w1+w2+1,rn,rd,`${L}(으)로 통분한 다음, 분수끼리 더한 값이 1보다 크면 자연수로 1을 올려.`,`${w1}과 ${fr(n1*L/d1,L)} + ${w2}과 ${fr(n2*L/d2,L)} = ${w1+w2}과 ${fr(s,L)} = ${mixed(w1+w2+1,rn,rd)}`);};
  const f=()=>{let n1,d1,n2,d2,L,a,b;do{[n1,d1,n2,d2]=fracs();L=lcm(d1,d2);a=n1*L/d1;b=n2*L/d2;}while(a>=b);const w1=ri(3,5),w2=ri(1,w1-2),[rn,rd]=red(L+a-b,L);return mxq(`<p class="big">${mixed(w1,n1,d1)} − ${mixed(w2,n2,d2)} = □</p><p>대분수로 나타내세요. (기약분수로)</p>`,w1-w2-1,rn,rd,`${L}(으)로 통분했을 때 분수 부분을 뺄 수 없으면 자연수에서 1을 빌려 와.`,`${mixed(w1,a,L)} − ${mixed(w2,b,L)} = ${mixed(w1-1,L+a,L)} − ${mixed(w2,b,L)} = ${mixed(w1-w2-1,rn,rd)}`);};
  return [a(),b(),c(),e(),f()];}},
{id:'volcano-2',r:'volcano',t:'분수의 곱셈',goal:'(분수)×(자연수), (분수)×(분수)를 계산하고 약분해요.',
 comic:[N(`화산 쿠키 공장. 쿠키 반죽이 한 판에 ${fr(3,4)} kg씩, 2판 필요해요.`),

  const b=()=>{let d,n,k;do{d=ri(4,12);n=ri(1,d-1);k=ri(2,5);}while(gcd(n,d)!==1||n*k>=d);const [rn,rd]=red(n*k,d);return frq(`<p class="big">${fr(n,d)} × ${k} = □</p><p>기약분수로 나타내세요.</p>`,rn,rd,'분자에 자연수를 곱해.',`${fr(`${n} × ${k}`,d)} = ${fr(n*k,d)}${rd!==d?` = ${fr(rn,rd)} (${gcd(n*k,d)}(으)로 약분)`:''}`);};
  const c=()=>{const d=pick([2,3,4,5,6]),n=ri(1,d-1),t=d*ri(2,8);return num(`<p><b>${t}</b>의 ${fr(n,d)}는 얼마일까요?</p>`,t/d*n,`${t}을(를) ${d}(으)로 나눈 것 중 ${n}개야.`,`${t} × ${fr(n,d)} = ${t/d*n}`);};
  const f=()=>{let w,n,d,p,q;do{d=ri(2,5);w=ri(1,2);n=ri(1,d-1);q=ri(2,6);p=ri(1,q-1);}while(gcd(n,d)!==1||gcd(p,q)!==1);const N=w*d+n,[rn,rd]=red(N*p,d*q);if(rd===1)return num(`<p class="big">${mixed(w,n,d)} × ${fr(p,q)} = □</p>`,rn,`대분수를 가분수 ${fr(N,d)}(으)로 바꾼 다음 곱해.`,`${fr(N,d)} × ${fr(p,q)} = ${fr(N*p,d*q)} = ${rn}`);return frq(`<p class="big">${mixed(w,n,d)} × ${fr(p,q)} = □</p><p>가분수 또는 진분수로, 기약분수로 나타내세요.</p>`,rn,rd,`대분수를 가분수 ${fr(N,d)}(으)로 바꾼 다음 곱해.`,`${fr(N,d)} × ${fr(p,q)} = ${fr(N*p,d*q)}${rd!==d*q?` = ${fr(rn,rd)}`:''}`);};
  return [a(),b(),f(),c(),a()];}},
{id:'volcano-3',r:'volcano',t:'소수의 곱셈',goal:'(소수)×(자연수), (소수)×(소수)를 계산하고 소수점 위치를 정해요.',

  return [a(),b(),c(),a(),d()];}},

{id:'canyon-1',r:'canyon',t:'분수의 나눗셈',goal:'(분수)÷(자연수), (분수)÷(분수)를 계산해요.',
 comic:[N(`비율 협곡의 물통에 물이 ${fr(3,4)} L 있어요. 3명이 똑같이 나눠 마셔요.`),

{id:'canyon-2',r:'canyon',t:'소수의 나눗셈',goal:'(소수)÷(자연수), (소수)÷(소수)를 계산해요.',
 comic:[N('협곡 다리 공사. 길이 7.2 m 밧줄을 3도막으로 똑같이 잘라요.'),
  H('think','72 ÷ 3 = 24니까 2.4 m!'),

 quiz:()=>{

  return [a(),e(),pick([b,c])(),f(),d()];}},

{id:'observ-1',r:'observ',t:'비례식과 비례배분',goal:'비의 성질로 비례식을 풀고, 전체를 주어진 비로 나눠요.',
 comic:[N('천문대 망원경 설계도에 "2 : 3 = 8 : □"라고 적혀 있어요.'),
  H('think','2에 4를 곱하면 8이니까 3에도 4를 곱해서 12!'),
  S('happy','맞아. 비의 전항과 후항에 같은 수를 곱해도 비율은 같아. 외항의 곱과 내항의 곱도 같지: 2 × 12 = 3 × 8.'),
  T('happy','별사탕 20개를 2 : 3으로 나누면 2개, 3개?'),
  S('oops',`전체를 2 + 3 = 5묶음으로 생각해야 해. 20의 ${fr(2,5)}는 8, ${fr(3,5)}는 12!`),
  H('happy','비례배분은 전체를 비의 합으로 나누는 거구나!')],
 widget:'proportion',
 quiz:()=>{
  const a=()=>{let x=ri(1,9),y=ri(2,9);while(gcd(x,y)!==1||x===y)y=ri(2,9);const k=ri(2,6);return num(`<p class="big">${x} : ${y} = ${x*k} : □</p>`,y*k,`${x}에 몇을 곱하면 ${x*k}이(가) 될까? 후항에도 같은 수를 곱해.`,`${x} × ${k} = ${x*k}, ${y} × ${k} = ${y*k}`);};
  const b=()=>{let x=ri(1,6),y=ri(2,7);while(x===y)y=ri(2,7);const k=ri(3,8),t=(x+y)*k;return mlq(`<p>구슬 <b>${t}개</b>를 하루와 셈이가 <b>${x} : ${y}</b>로 나누어 가지려고 해요. 각각 몇 개씩일까요?</p>`,['개(하루)','개(셈이)'],[x*k,y*k],`전체를 ${x} + ${y} = ${x+y}묶음으로 나눠 봐.`,`하루: ${t} × ${fr(x,x+y)} = ${x*k}, 셈이: ${t} × ${fr(y,x+y)} = ${y*k}`,`하루 ${x*k}개, 셈이 ${y*k}개`);};
  const c=()=>{const x=ri(2,9),k=ri(2,5);let y=ri(2,9);while(y===x)y=ri(2,9);return num(`<p>비례식 <b>${x} : ${y} = ${x*k} : ${y*k}</b>에서 외항의 곱은?</p>`,x*y*k,'바깥쪽에 있는 두 수가 외항이야.',`외항 ${x}과(와) ${y*k}: ${x} × ${y*k} = ${x*y*k}`);};
  const d=()=>{const m=ri(2,5),k=ri(3,9);return num(`<p>지도에서 <b>1 cm</b>가 실제로 <b>${m} km</b>예요. 지도에서 <b>${k} cm</b>인 거리는 실제로 몇 km일까요?</p>`,m*k,`1 : ${m} = ${k} : □`,`1 : ${m} = ${k} : ${m*k}`);};

{id:'observ-2',r:'observ',t:'원주와 원의 넓이',goal:'원주율(3.14)을 이용해 원주와 원의 넓이를 구해요.',

{id:'observ-3',r:'observ',t:'직육면체의 겉넓이와 부피',goal:'직육면체와 정육면체의 겉넓이와 부피를 구해요.',

  return [a(),b(),c(),d(),a()];}}
);
function mixedExpr(){
  const T=[
    ()=>{const a=ri(2,20),b=ri(2,9),c=ri(2,9);return {steps:[`${a} + ${b} × ${c}`,`${a} + ${b*c}`,`${a+b*c}`],ans:a+b*c,hint:'곱셈을 먼저 계산해.'};},
    ()=>{const a=ri(2,9),b=ri(2,9),c=ri(2,9);return {steps:[`(${a} + ${b}) × ${c}`,`${a+b} × ${c}`,`${(a+b)*c}`],ans:(a+b)*c,hint:'괄호 안을 먼저 계산해.'};},
    ()=>{const c=ri(2,9),q=ri(2,9),b=c*q,a=ri(q+1,40);return {steps:[`${a} − ${b} ÷ ${c}`,`${a} − ${q}`,`${a-q}`],ans:a-q,hint:'나눗셈을 먼저 계산해.'};},
    ()=>{const a=ri(3,9),b=ri(3,9),c=ri(2,5),d=ri(2,5);if(a*b<=c*d)return {steps:[`${c} × ${d} + ${a} × ${b}`,`${c*d} + ${a*b}`,`${c*d+a*b}`],ans:c*d+a*b,hint:'곱셈 두 개를 먼저 계산해.'};return {steps:[`${a} × ${b} − ${c} × ${d}`,`${a*b} − ${c*d}`,`${a*b-c*d}`],ans:a*b-c*d,hint:'곱셈 두 개를 먼저 계산해.'};},
    ()=>{const b=ri(2,6),q=ri(2,9),c=ri(2,5),a=b*q;return {steps:[`${a} ÷ ${b} × ${c}`,`${q} × ${c}`,`${q*c}`],ans:q*c,hint:'곱셈과 나눗셈만 있으면 앞에서부터 차례로 계산해.'};},
    ()=>{const a=ri(15,40),b=ri(2,a-5),c=ri(2,20);return {steps:[`${a} − ${b} + ${c}`,`${a-b} + ${c}`,`${a-b+c}`],ans:a-b+c,hint:'덧셈과 뺄셈만 있으면 앞에서부터 차례로 계산해.'};},
    ()=>{const c=ri(2,6),q=ri(2,8),b=ri(1,15),a=b+c*q,d=ri(1,20);return {steps:[`(${a} − ${b}) ÷ ${c} + ${d}`,`${a-b} ÷ ${c} + ${d}`,`${q} + ${d}`,`${q+d}`],ans:q+d,hint:'괄호 → 나눗셈 → 덧셈 순서야.'};}
  ];
  return pick(T)();
}

insertLessonAfter('hill-2',{id:'hill-4',r:'hill',t:'짝수와 홀수, 몇십몇의 덧셈과 뺄셈',goal:'짝수와 홀수를 알고, 받아올림·받아내림이 없는 (몇십몇)±(몇십몇)을 계산해요.',

insertLesson('mul-1',{id:'mul-0',r:'mul',t:'세 자리 수의 덧셈과 뺄셈',goal:'받아올림·받아내림이 있는 (세 자리 수)±(세 자리 수)를 계산해요.',
 comic:[N('곱셈 숲 입구 매표소. 어제 입장객 457명, 오늘 368명이 왔어요.'),
  T('happy','7 + 8 = 15, 5 + 6 = 11, 4 + 3 = 7. 붙이면 71115명!'),

insertLesson('frac-6',{id:'frac-7',r:'frac',t:'분수와 소수',goal:'분모가 10인 분수를 소수로 나타내고, 소수 한 자리 수를 읽고 써요.',

insertLessonAfter('volcano-1',{id:'volcano-4',r:'volcano',t:'수의 범위와 어림',goal:'이상·이하·초과·미만으로 수의 범위를 나타내고, 올림·버림·반올림을 해요.',

 widget:'rounding',
 quiz:()=>{
  const a=()=>{const lo=ri(10,40),hi=lo+ri(5,12),lk=pick(['이상','초과']),hk=pick(['이하','미만']);const cnt=(hk==='이하'?hi:hi-1)-(lk==='이상'?lo:lo+1)+1;return num(`<p><b>${lo} ${lk} ${hi} ${hk}</b>인 자연수는 모두 몇 개일까요?</p>`,cnt,'"이상·이하"는 그 수를 포함하고, "초과·미만"은 포함하지 않아.',`${lk==='이상'?lo:lo+1}부터 ${hk==='이하'?hi:hi-1}까지 ${cnt}개`);};
  const b=()=>{const n=ri(1001,9999),pl=pick([[10,'십'],[100,'백'],[1000,'천']]),m=pl[0],r=Math.round(n/m)*m;return num(`<p class="big">${n}</p><p>반올림하여 <b>${pl[1]}의 자리까지</b> 나타내면?</p>`,r,`${pl[1]}의 자리 바로 아래 자리 숫자가 5 이상이면 올리고, 4 이하면 버려.`,`바로 아래 자리 숫자가 ${Math.floor(n/(m/10))%10}이므로 ${r}`);};
  const c=()=>{const n=ri(101,999),up=Math.random()<.5,m=up?Math.ceil(n/100)*100:Math.floor(n/100)*100;if(n%100===0)return c();return num(`<p class="big">${n}</p><p><b>${up?'올림':'버림'}</b>하여 백의 자리까지 나타내면?</p>`,m,up?'백의 자리 아래 수가 조금이라도 있으면 백의 자리를 1 올려.':'백의 자리 아래 수를 모두 0으로 버려.',`${n} → ${m}`);};
  const d=()=>{const per=pick([10,20,30,40]),n=ri(per+3,per*9);if(n%per===0)return d();const k=Math.ceil(n/per);return num(`<p>학생 <b>${n}명</b>이 버스를 타려고 해요. 버스 한 대에 <b>${per}명</b>까지 탈 수 있다면, 버스는 적어도 몇 대 필요할까요?</p>`,k,'남는 학생도 버스를 타야 하니까 올림을 해.',`${n} ÷ ${per} = ${Math.floor(n/per)} … ${n%per}, 남는 ${n%per}명도 타야 하니 ${k}대`);};
  const e=()=>{const n=ri(12,98)*100+ri(1,99);return num(`<p>동전 <b>${n}원</b>을 1000원짜리 지폐로 바꾸면 최대 몇 장까지 바꿀 수 있을까요?</p>`,Math.floor(n/1000),'1000원이 안 되는 돈은 지폐로 바꿀 수 없으니 버림을 해.',`${n}원 → 버림하면 ${Math.floor(n/1000)*1000}원, ${Math.floor(n/1000)}장`);};
  return [a(),b(),c(),d(),e()];}});

const hg=(c,v,t='')=>String.fromCharCode(0xAC00+(CHO.indexOf(c)*21+JUNG.indexOf(v))*28+JONG.indexOf(t));
const decomp=ch=>{const n=ch.charCodeAt(0)-0xAC00;return [CHO[Math.floor(n/588)],JUNG[Math.floor(n%588/28)],JONG[n%28]];};
const VSWAP={'ㅏ':'ㅓ','ㅓ':'ㅏ','ㅗ':'ㅜ','ㅜ':'ㅡ','ㅡ':'ㅜ','ㅣ':'ㅔ','ㅐ':'ㅔ','ㅔ':'ㅐ','ㅑ':'ㅕ','ㅕ':'ㅑ','ㅛ':'ㅠ','ㅠ':'ㅛ','ㅘ':'ㅏ','ㅟ':'ㅜ','ㅚ':'ㅗ','ㅢ':'ㅡ'};
function misspell(w,k){const chars=[...w],i=(k||0)%chars.length,[c,v,t]=decomp(chars[i]);chars[i]=hg(c,VSWAP[v]||'ㅏ',t);const out=chars.join('');return out===w?w+'ㅡ':out;}
function misspell2(w){const chars=[...w],i=chars.length-1,[c,v,t]=decomp(chars[i]);chars[i]=t?hg(c,v,''):hg(c,v,'ㄴ');return chars.join('');}

function mkHangul(withJong){return {intro:withJong?'자음, 모음, 받침을 바꿔 보세요. 받침은 글자 맨 아래에 붙어요. 스피커를 누르면 소리를 들을 수 있어요.':'자음과 모음을 바꿔 보세요. 둘이 만나 글자가 돼요. 스피커를 누르면 소리를 들을 수 있어요.',
  init:()=>({c:0,v:0,t:withJong?5:0}),
  view:s=>{const ch=hg(BASIC_C[s.c],BASIC_V[s.v],JONG_S[s.t]);return `<div class="stps">${stp('c','자음',BASIC_C[s.c])}${stp('v','모음',BASIC_V[s.v])}${withJong?stp('t','받침',JONG_S[s.t]||'없음'):''}</div><div class="hg-big" lang="ko">${ch}</div><p class="eq">${BASIC_C[s.c]} + ${BASIC_V[s.v]}${withJong&&JONG_S[s.t]?` + ${JONG_S[s.t]}`:''} = <b>${ch}</b></p><button type="button" class="btn ghost" data-speak="${ch}" data-lang="ko-KR">${SPEAKER} 소리 듣기</button>`;},
  step:(k,d,s)=>{const n={c:BASIC_C.length,v:BASIC_V.length,t:JONG_S.length}[k];s[k]=(s[k]+d+n)%n;}};}
function mkSorter(intro,cats,items){return {intro,
  init:()=>({order:shuffle(items.map((_,i)=>i)),i:0,res:[]}),
  view:s=>{const done=s.i>=s.order.length,last=s.res[s.res.length-1],score=s.res.filter(r=>r.ok).length;
    const cur=done?null:items[s.order[s.i]];
    return `${done?`<p class="eq">${s.res.length}개 중 <b>${score}개</b> 맞았어요!</p><button type="button" class="btn" data-act="reset">다시 하기</button>`:`<p class="note">${s.i+1} / ${items.length} · 어디에 들어갈까요?</p><div class="sort-item">${cur[0]}</div><div class="row">${cats.map((c,ci)=>`<button type="button" class="btn ${ci?'ghost':''}" data-act="cat" data-i="${ci}">${c}</button>`).join('')}</div>`}
    ${last?`<p class="fb ${last.ok?'ok':'bad'}"><b>${last.ok?'맞았어요!':'아쉬워요.'}</b> ${last.label} → ${cats[last.ans]}${last.why?` · ${last.why}`:''}</p>`:''}
    <div class="sort-cols">${cats.map((c,ci)=>`<div><b>${c}</b><ul>${s.res.filter(r=>r.ans===ci).map(r=>`<li>${r.label}</li>`).join('')}</ul></div>`).join('')}</div>`;},
  act:(a,el,s)=>{if(a==='cat'&&s.i<s.order.length){const it=items[s.order[s.i]],ci=+el.dataset.i;s.res.push({label:it[0],ans:it[1],ok:ci===it[1],why:it[2]});s.i++;}if(a==='reset')Object.assign(s,{order:shuffle(items.map((_,i)=>i)),i:0,res:[]});}};}
function mkOrder(intro,src,o={}){const get=()=>typeof src==='function'?src():src;return {intro,
  init:()=>{const items=get();return {items,pool:shuffle(items.map((_,i)=>i)),picked:[]};},
  view:s=>{const full=s.picked.length===s.items.length,ok=full&&s.picked.every((p,i)=>s.items[p]===s.items[i]);
    const sep=o.join||' → ';
    return `<div class="chiprow" aria-label="고른 순서">${s.picked.length?s.picked.map(p=>`<span class="chip">${s.items[p]}</span>`).join(o.join===' '?'':'<span class="arrow">→</span>'):'<span class="note">아래에서 차례대로 눌러 보세요</span>'}</div>
    <div class="row">${s.pool.map(p=>`<button type="button" class="chip ${s.picked.includes(p)?'used':''}" data-act="pick" data-i="${p}" ${s.picked.includes(p)?'disabled':''}>${s.items[p]}</button>`).join('')}</div>
    ${full?`<p class="fb ${ok?'ok':'bad'}"><b>${ok?'정답!':'다시 생각해 볼까요?'}</b> ${ok?(o.lang?`<span lang="en">${s.items.join(sep)}</span>`:s.items.join(sep)):'순서가 조금 달라요. "한 칸 지우기"로 고쳐 보세요.'}</p>`:''}
    <div class="row"><button type="button" class="btn ghost" data-act="undo" ${s.picked.length?'':'disabled'}>한 칸 지우기</button><button type="button" class="btn ghost" data-act="new">${typeof src==='function'?'새 문제':'다시 섞기'}</button>${full&&ok&&o.lang?`<button type="button" class="btn ghost" data-speak="${s.items.join(' ')}" data-lang="${o.lang}">${SPEAKER} 듣기</button>`:''}</div>`;},
  act:(a,el,s)=>{if(a==='pick'){const i=+el.dataset.i;if(!s.picked.includes(i))s.picked.push(i);}if(a==='undo')s.picked.pop();if(a==='new'){const items=get();Object.assign(s,{items,pool:shuffle(items.map((_,i)=>i)),picked:[]});}}};}
function mkCards(intro,cards,lang='ko-KR'){return {intro,
  init:()=>({open:[]}),
  view:s=>`<div class="cards">${cards.map((c,i)=>`<button type="button" class="card ${s.open.includes(i)?'open':''}" data-act="card" data-i="${i}" aria-pressed="${s.open.includes(i)}">${s.open.includes(i)?c.b:c.f}</button>`).join('')}</div><p class="note">카드를 누르면 뒤집혀요${cards[0].say?'. 소리도 함께 나와요':''}.</p><button type="button" class="btn ghost" data-act="close">모두 덮기</button>`,
  act:(a,el,s)=>{if(a==='card'){const i=+el.dataset.i;s.open=s.open.includes(i)?s.open.filter(x=>x!==i):[...s.open,i];if(cards[i].say&&s.open.includes(i))speak(cards[i].say,lang);}if(a==='close')s.open=[];}};}

  S('happy','글자는 자음과 모음이 만나서 만들어져. ㄱ과 ㅏ를 합치면 "가"!'),
  SC('<p class="big">ㄱ + ㅏ = 가</p>','자음 + 모음'),
  T('happy','그럼 ㅏ를 먼저 쓰고 ㄱ을 뒤에 써도 되지?'),
  S('oops','삐빅! 자음을 먼저 쓰고 모음은 옆이나 아래에 써. ㄴ과 ㅗ는 "노"처럼 아래에!'),
  H('happy','ㄱ, ㄴ, ㄷ… 자음은 14개, ㅏ, ㅑ, ㅓ… 모음은 10개구나!')],
 widget:mkHangul(false),
 quiz:()=>{
  const a=()=>{const c=pick(BASIC_C),v=pick(BASIC_V),vs=shuffle(BASIC_V.filter(x=>x!==v)),cs=shuffle(BASIC_C.filter(x=>x!==c));return MC(`<p class="big">${c} + ${v}</p><p>두 글자를 합치면 어떤 글자가 될까요?</p>`,hg(c,v),[hg(c,vs[0]),hg(c,vs[1]),hg(cs[0],v)],'자음 소리 다음에 모음 소리를 이어서 읽어 봐.',`${c} + ${v} = ${hg(c,v)}`);};
  const b=()=>{const askV=Math.random()<.5;return askV?MC('<p>다음 중 <b>모음</b>은 어느 것일까요?</p>',pick(BASIC_V),pickN(BASIC_C,3),'모음은 ㅏ, ㅑ, ㅓ, ㅕ처럼 길쭉한 막대 모양이 있어.','ㅏ, ㅑ, ㅓ, ㅕ, ㅗ, ㅛ, ㅜ, ㅠ, ㅡ, ㅣ가 모음이에요.'):MC('<p>다음 중 <b>자음</b>은 어느 것일까요?</p>',pick(BASIC_C),pickN(BASIC_V,3),'자음은 ㄱ, ㄴ, ㄷ, ㄹ처럼 글자의 첫소리를 내.','ㄱ부터 ㅎ까지 14개가 기본 자음이에요.');};
  const c=()=>{const ch=pick(['나','도','무','소','하','기','바','주','커','토','피','우','라','지','코','머']),[cc]=decomp(ch);return MC(`<p class="big">${ch}</p><p>이 글자를 만든 <b>자음</b>은 무엇일까요?</p>`,cc,pickN(BASIC_C.filter(x=>x!==cc),3),'글자를 소리 낼 때 맨 처음 나는 소리를 생각해 봐.',`${ch} = ${cc} + ${decomp(ch)[1]}`);};
  const d=()=>{const useV=Math.random()<.5,arr=useV?BASIC_V:BASIC_C,i=ri(2,arr.length-2);return MC(`<p class="big">${arr.slice(i-2,i+1).join(' ')} □</p><p>□에 들어갈 ${useV?'모음':'자음'}은 무엇일까요?</p>`,arr[i+1],[arr[i-1],arr[(i+3)%arr.length],arr[(i+5)%arr.length]],`${useV?'ㅏ, ㅑ, ㅓ, ㅕ, ㅗ, ㅛ, ㅜ, ㅠ, ㅡ, ㅣ':'ㄱ, ㄴ, ㄷ, ㄹ, ㅁ, ㅂ, ㅅ, ㅇ, ㅈ, ㅊ, ㅋ, ㅌ, ㅍ, ㅎ'} 순서를 떠올려 봐.`,`${arr.slice(i-2,i+2).join(', ')} 순서예요.`);};
  const e=()=>{const c=pick(BASIC_C),v=pick(BASIC_V),w=hg(c,v),vs=shuffle(BASIC_V.filter(x=>x!==v));return MC('<p>스피커를 눌러 소리를 듣고, 들은 글자를 골라 보세요.</p>',w,[hg(c,vs[0]),hg(c,vs[1]),hg(pick(BASIC_C.filter(x=>x!==c)),v)],'한 번 더 들어 보고, 입 모양을 따라 해 봐.',`들은 글자: ${w}`,{listen:KO(w)});};
  return [a(),b(),c(),d(),e()];}},
{id:'hangul-2',r:'hangul',t:'받침이 있는 글자',goal:'받침이 있는 글자를 읽고, 자음·모음·받침으로 나누어 봐요.',
 comic:[N('한글 마을 동물원. 곰이 낮잠을 자고 있어요.'),
  H('think','"고" 아래에 ㅁ을 붙이면… "곰"!'),
  S('happy','글자 아래에 붙는 자음을 받침이라고 해. 곰은 ㄱ + ㅗ + ㅁ이야.'),
  SC('<p class="big">ㄱ + ㅗ + ㅁ = 곰</p>','받침 ㅁ'),
  T('happy','그럼 "산"의 받침은 ㅅ이지!'),
  H('oops','ㅅ은 처음 소리야. 받침은 맨 아래 있는 ㄴ이야!')],
 widget:mkHangul(true),
 quiz:()=>{
  const JS=['ㄱ','ㄴ','ㄹ','ㅁ','ㅂ','ㅇ'];
  const a=()=>{const c=pick(BASIC_C),v=pick(['ㅏ','ㅓ','ㅗ','ㅜ','ㅣ']),t=pick(JS),t2=pick(JS.filter(x=>x!==t));return MC(`<p class="big">${c} + ${v} + ${t}</p><p>합치면 어떤 글자가 될까요?</p>`,hg(c,v,t),[hg(c,v),hg(c,v,t2),hg(pick(BASIC_C.filter(x=>x!==c)),v,t)],'자음과 모음으로 글자를 만들고, 받침을 맨 아래에 붙여.',`${c} + ${v} + ${t} = ${hg(c,v,t)}`);};
  const b=()=>{const w=pick(['곰','산','물','밥','강','책','눈','달','집','공','문','빵','숲','꽃']),[c,v,t]=decomp(w);return MC(`<p class="big">${w}</p><p>이 글자의 <b>받침</b>은 무엇일까요?</p>`,t,[c,...pickN(BASIC_C.filter(x=>x!==t&&x!==c),2)].filter(x=>x!==t),'글자의 맨 아래에 있는 자음을 찾아봐.',`${w} = ${c} + ${v} + ${t}, 받침은 ${t}이에요.`);};
  const c=()=>MC('<p>받침이 있는 글자가 들어 있는 낱말은 어느 것일까요?</p>',pick(['연필','사탕','구름','책상','신발','동물','눈사람','딸기']),pickN(['나무','바다','우유','기차','고구마','토끼','오이','모자','나비','포도'],3),'글자마다 맨 아래에 자음이 붙어 있는지 살펴봐.','받침이 있는 글자가 들어 있는 낱말을 찾았어요.');
  const d=()=>{const c=pick(['ㄱ','ㄴ','ㄷ','ㅁ','ㅂ','ㅅ','ㅈ']),v=pick(['ㅏ','ㅗ','ㅜ','ㅣ']),t=pick(JS),others=shuffle(JS.filter(x=>x!==t));return MC('<p>소리를 듣고, 들은 글자를 골라 보세요.</p>',hg(c,v,t),[hg(c,v),hg(c,v,others[0]),hg(c,v,others[1])],'끝소리를 잘 들어 봐. 입이 닫히면 ㅁ이나 ㅂ, 혀가 올라가면 ㄴ이나 ㄹ일 수 있어.',`들은 글자: ${hg(c,v,t)}`,{listen:KO(hg(c,v,t))});};
  const e=()=>{const w=pick(['곰','산','물','밥','강','책','눈','달','집','문']),[c,v,t]=decomp(w);return MC(`<p class="big">${w}</p><p>자음, 모음, 받침으로 바르게 나눈 것은?</p>`,`${c} + ${v} + ${t}`,[`${t} + ${v} + ${c}`,`${c} + ${VSWAP[v]||'ㅏ'} + ${t}`,`${c} + ${v}`],'처음 소리, 가운데 소리, 끝소리 순서로 나눠 봐.',`${w} = ${c} + ${v} + ${t}`);};
  return [a(),b(),c(),d(),e()];}},

{id:'spell-1',r:'spell',t:'소리와 글자가 다른 낱말',goal:'받침이 뒤 글자로 넘어가 소리 나는 낱말을 바르게 써요.',

 widget:mkCards('카드 앞면은 소리 나는 대로, 뒷면은 바르게 쓴 모양이에요. 눌러서 소리를 듣고 확인해 보세요.',SP1.slice(0,8).map(([snd,w])=>({f:`[${snd}]`,b:w,say:w}))),

{id:'spell-2',r:'spell',t:'헷갈리는 말',goal:'소리나 모양이 비슷해서 헷갈리는 낱말을 뜻에 맞게 써요.',

{id:'spell-3',r:'spell',t:'문장 부호',goal:'마침표, 물음표, 느낌표, 쉼표를 알맞게 써요.',

 quiz:()=>{

{id:'words-1',r:'words',t:'반대말과 비슷한 말',goal:'뜻이 반대인 낱말과 뜻이 비슷한 낱말을 찾아요.',
 comic:[N('낱말 숲 입구. 커다란 나무와 작은 나무가 나란히 서 있어요.'),

 quiz:()=>{

'식물이 자라는 정도를 알아보려면 무엇을 재면 좋을까요?':'줄기 길이를 자로 재고 잎의 개수를 세어 기록하면 얼마나 자랐는지 알 수 있어요.',

const sciEx=(q,ok)=>SCI_EX[q]||`정답은 ${ok}.`;
const sciMC=([q,ok,ws])=>MC(`<p>${q}</p>`,ok,ws,'만화와 직접 해 보기에서 본 내용을 떠올려 봐.',sciEx(q,ok));
const sciQ=(bank)=>()=>pickN(bank,5).map(sciMC);
const mix=(bank,extra)=>()=>{const ps=pickN(bank,4).map(sciMC);ps.splice(ri(0,4),0,extra());return ps;};
/* 도전 단계: 설명 중 틀린 것 고르기 + 섞인 문제, 힌트 없이 */
const sciCh=(bank,extra)=>()=>{
  const out=[];
  const truths=bank.filter(b=>SCI_EX[b[0]]);
  const stem=q=>q.replace(/\s*(어떻게 될까요|무엇일까요|일까요|할까요|까요)?\?$/,'');
  for(let k=0;k<2;k++){const [bad,...good]=pickN(truths,4);const wrongStmt=`${stem(bad[0])} → ${pick(bad[2])}`;out.push(MC('<p>다음 중 <b>틀린</b> 것은?</p>',wrongStmt,good.map(g=>`${stem(g[0])} → ${g[1]}`),'하나씩 맞는지 따져 봐.',`${bad[0]} 정답은 ${bad[1]}. ${SCI_EX[bad[0]]}`));}
  pickN(bank,extra?2:3).forEach(b=>out.push(sciMC(b)));
  if(extra)out.push(extra());
  return shuffle(out);
};

const NOJONG_W=['나무','바다','우유','기차','오이','포도','나비','모자','토끼','하마','다리','가수','사자','두부','고기','지구','머리','버스'];

 'hangul-1':()=>{

  const d=()=>{const [w]=pick(JONG_W.filter(x=>x[1]>0));return txq(`<p class="big">${jamoOf(w)}</p><p>합쳐서 만든 낱말을 써 보세요.</p>`,w,CH_HINT,`${jamoOf(w)} → ${w}`);};

 'hangul-3':()=>pickN(DICTATE,4).map(w=>txq('<p>받아쓰기! 스피커를 눌러 듣고 낱말을 써 보세요.</p>',w,CH_HINT,`정답: ${w}`,{listen:KO(w)})).concat([(()=>{const [w,e]=pick(KO_DICT);return txq(`${pic(e)}<p>그림에 알맞은 낱말을 직접 써 보세요.</p>`,w,CH_HINT,`정답: ${w}`);})()]),
 'spell-1':()=>{

   txq('<p>받아쓰기! 듣고 바르게 써 보세요.</p>',ps[2][1],CH_HINT,`정답: ${ps[2][1]} (소리: [${ps[2][0]}])`,{listen:KO(ps[2][1])}),

 'words-1':()=>{

/* one set never repeats the same problem: a duplicate is regenerated from the same slot */
const dedupe=gen=>()=>{const ps=gen(),seen=new Set();for(let i=0;i<ps.length;i++){let k=0;while(seen.has(ps[i].q+'|'+ps[i].show)&&k++<15)ps[i]=gen()[i];seen.add(ps[i].q+'|'+ps[i].show);}return ps;};
LESSONS.forEach(L=>{L.quiz=dedupe(L.quiz);if(L.challenge)L.challenge=dedupe(L.challenge);});

    view:s=>{const k=s.on.filter(Boolean).length;return `<div class="stps">${stp('d','몇 조각으로 나눌까?',s.d)}</div><div class="pie-row"><div class="viz">${pie(s.d,s.on.map(x=>x?'on':''),{size:210,click:true,label:`${s.d}조각 중 ${k}조각 색칠`})}</div><div class="frbox">${fr(k,s.d,'big')}<p class="read">${s.d}분의 ${k}</p><ul class="legend"><li><b>분자 ${k}</b>색칠한 조각 수</li><li><b>분모 ${s.d}</b>전체 조각 수</li></ul></div></div><p class="note">조각을 눌러서 색칠하거나 지워 보세요.</p>`;},
    step:(k,d,s)=>{const n=clamp(s.d+d,2,10);s.on=Array.from({length:n},(_,i)=>s.on[i]||false);s.d=n;},
    act:(a,el,s)=>{if(a==='slice'){const i=+el.dataset.i;s.on[i]=!s.on[i];}}},
  compare:{intro:'두 분수를 막대로 나란히 놓고 길이를 비교해 보세요. 분자와 분모를 바꿔 가며 규칙을 찾아봐요.',
    init:()=>({an:1,ad:2,bn:1,bd:8}),
    view:s=>{const A=s.an/s.ad,B=s.bn/s.bd,sg=Math.abs(A-B)<1e-9?'=':A>B?'&gt;':'&lt;';
      const msg=s.ad===s.bd?'분모가 같으면 조각 크기가 같으니까, 분자가 큰 쪽이 더 커요.':(s.an===1&&s.bn===1)?'분자가 1이면 분모가 작을수록(적게 나눌수록) 한 조각이 커요.':'막대의 색칠한 길이를 비교해 보세요.';
      const side=(n,d,kn,kd)=>`<div class="cmp-side"><div class="stps">${stp(kn,'분자',n)}${stp(kd,'분모',d)}</div>${bar(d,n,{w:300,h:44})}${fr(n,d,'big')}</div>`;
      return `<div class="cmp">${side(s.an,s.ad,'an','ad')}<div class="sgn" aria-label="비교 기호">${sg}</div>${side(s.bn,s.bd,'bn','bd')}</div><p class="note">${msg}</p>`;},
    step:(k,d,s)=>{if(k==='ad'||k==='bd'){s[k]=clamp(s[k]+d,2,10);s.an=Math.min(s.an,s.ad);s.bn=Math.min(s.bn,s.bd);}else s[k]=clamp(s[k]+d,1,k==='an'?s.ad:s.bd);}},
  groups:{intro:'사탕 수와 묶음 수를 정하고, 묶음을 눌러 색칠해 보세요. 색칠한 묶음이 전체의 얼마인지 알 수 있어요.',
    init:()=>({t:12,g:3,sel:[0]}),
    view:s=>{const per=s.t/s.g,k=s.sel.length;return `<div class="stps">${stp('t','사탕',s.t)}${stp('g','묶음 수',s.g)}</div>${candies(s.t,s.g,s.sel,true)}<p class="eq">사탕 ${s.t}개를 똑같이 ${s.g}묶음으로 → 한 묶음에 ${per}개<br>색칠한 ${k}묶음 = 전체의 ${fr(k,s.g)} = 사탕 <b>${k*per}개</b></p>`;},
    step:(k,d,s)=>{if(k==='t'){s.t=TOT[clamp(TOT.indexOf(s.t)+d,0,TOT.length-1)];const ds=divs(s.t);if(!ds.includes(s.g))s.g=ds[0];}else{const ds=divs(s.t);s.g=ds[clamp(ds.indexOf(s.g)+d,0,ds.length-1)];}s.sel=[0];},
    act:(a,el,s)=>{if(a==='grp'){const i=+el.dataset.i;s.sel=s.sel.includes(i)?s.sel.filter(x=>x!==i):[...s.sel,i];}}},
  improper:{intro:'분자를 늘려 가며 피자 조각을 모아 보세요. 분자가 분모와 같아지면 피자 한 판이 돼요.',
    init:()=>({d:4,n:5}),
    view:s=>{const w=Math.floor(s.n/s.d),r=s.n%s.d;const kind=s.n<s.d?'진분수 (1보다 작아요)':s.n===s.d?'가분수 (딱 1이에요)':'가분수 (1보다 커요)';
      const as=s.n>=s.d?(r?` = 대분수 ${mixed(w,r,s.d)}`:` = 자연수 ${w}`):'';
      return `<div class="stps">${stp('n','분자',s.n)}${stp('d','분모',s.d)}</div>${pies(s.n,s.d,110)}<p class="eq">${fr(s.n,s.d)}${as}</p><p class="note"><b>${kind}</b></p>`;},
    step:(k,d,s)=>{if(k==='d'){s.d=clamp(s.d+d,2,6);s.n=clamp(s.n,1,3*s.d);}else s.n=clamp(s.n+d,1,3*s.d);}},
  addpie:{intro:'더하기와 빼기를 골라 보고, 조각 수를 바꿔 보세요. 분모는 언제나 그대로예요.',
    init:()=>({mode:'add',d:6,a:2,b:3}),
    view:s=>{const add=s.mode==='add';const cls=Array.from({length:s.d},(_,i)=>add?(i<s.a?'on':i<s.a+s.b?'on2':''):(i<s.a-s.b?'on':i<s.a?'gone':''));
      return `<div class="row seg"><button type="button" class="btn ${add?'':'ghost'}" data-act="add" aria-pressed="${add}">더하기</button><button type="button" class="btn ${add?'ghost':''}" data-act="sub" aria-pressed="${!add}">빼기</button></div><div class="stps">${stp('d','분모',s.d)}${stp('a','첫째 분자',s.a)}${stp('b','둘째 분자',s.b)}</div><div class="viz">${pie(s.d,cls,{size:200})}</div><p class="eq">${fr(s.a,s.d)} ${add?'+':'−'} ${fr(s.b,s.d)} = <b>${fr(add?s.a+s.b:s.a-s.b,s.d)}</b></p><p class="note">조각 크기(분모 ${s.d})는 그대로! 조각 수(분자)만 ${s.a} ${add?'+':'−'} ${s.b} = ${add?s.a+s.b:s.a-s.b}</p>`;},
    step:(k,d,s)=>{if(k==='d')s.d=clamp(s.d+d,2,10);else s[k]+=d;WIDGETS.addpie.fix(s);},
    act:(a,el,s)=>{if(a==='add'||a==='sub'){s.mode=a;WIDGETS.addpie.fix(s);}},
    fix:s=>{if(s.mode==='add'){s.a=clamp(s.a,1,s.d-1);s.b=clamp(s.b,1,s.d-s.a);}else{s.a=clamp(s.a,1,s.d);s.b=clamp(s.b,0,s.a);}}}
};

/* ---------- widgets for grades 1, 2, 4, 5, 6 ---------- */
function barCls(cls,o={}){const d=cls.length,W=o.w||300,h=o.h||44;let p='';cls.forEach((c,i)=>{p+=`<rect class="sl ${c}" x="${(3+(W-6)*i/d).toFixed(2)}" y="3" width="${((W-6)/d).toFixed(2)}" height="${h-6}"/>`;});return `<svg class="pie" viewBox="0 0 ${W} ${h}" width="${W}" height="${h}" role="img" aria-label="${d}칸 막대">${p}</svg>`;}
const stepRow=(s,max,msgs,extra='')=>`<p class="note">${msgs[s.step]}</p><div class="row"><button type="button" class="btn" data-act="next" ${s.step>=max?'disabled':''}>다음 단계</button><button type="button" class="btn ghost" data-act="new">새 문제</button>${extra}</div>`;
const mkTenframe=(max,intro)=>({intro,
  init:()=>max>10?{a:8,b:5}:{a:3,b:4},
  view:s=>{const n=s.a+s.b;const make10=max>10&&n>10&&s.a<10?`<br>${s.a} + ${s.b} = ${s.a} + ${10-s.a} + ${n-10} = <b>${n}</b>`:'';return `<div class="stps">${stp('a','노란 구슬',s.a)}${stp('b','빨간 구슬',s.b)}</div>${tenFrame(s.a,s.b,max>10?2:1)}<p class="eq">${s.a}와(과) ${s.b}을(를) 모으면 <b>${n}</b>${make10}</p><p class="note">${n}은(는) ${s.a}와(과) ${s.b}(으)로 가를 수 있어요.${max>10?' 노란 구슬로 10칸을 먼저 채워 보세요.':''}</p>`;},
  step:(k,d,s)=>{if(k==='a'){s.a=clamp(s.a+d,1,9);s.b=Math.min(s.b,max-s.a);}else s.b=clamp(s.b+d,1,max-s.a);}});
const mkCol=op=>({intro:op==='+'?'"다음 단계"를 눌러 받아올림이 있는 덧셈을 한 단계씩 풀어 보세요.':'"다음 단계"를 눌러 받아내림이 있는 뺄셈을 한 단계씩 풀어 보세요.',
  init:()=>{let a,b;if(op==='+'){do{a=ri(15,69);b=ri(12,29);}while((a%10)+(b%10)<10||a+b>=100);}else{do{a=ri(31,98);b=ri(12,a-10);}while((a%10)>=(b%10));}return {a,b,step:0};},
  view:s=>{const ao=s.a%10,bo=s.b%10,at=Math.floor(s.a/10),bt=Math.floor(s.b/10);
    const msgs=op==='+'?[`${s.a} + ${s.b}를 세로로 써요. 일의 자리부터 계산해요.`,`일의 자리: ${ao} + ${bo} = ${ao+bo}. ${(ao+bo)%10}을 쓰고, 1을 십의 자리 위에 올려요.`,`십의 자리: ${at} + ${bt} + 1 = ${at+bt+1}. 답은 ${s.a+s.b}!`]
      :[`${s.a} − ${s.b}를 세로로 써요. 일의 자리부터 계산해요.`,`일의 자리: ${ao}에서 ${bo}를 뺄 수 없어요. 십의 자리에서 10을 빌려 와서 ${10+ao} − ${bo} = ${10+ao-bo}.`,`십의 자리: ${at-1} − ${bt} = ${at-1-bt}. 답은 ${s.a-s.b}!`];
    return `${vcol(s.a,s.b,op,s.step)}${stepRow(s,2,msgs)}`;},
  act:(a,el,s)=>{if(a==='next')s.step=Math.min(2,s.step+1);if(a==='new')Object.assign(s,mkCol(op).init());}});
const PCT_BASES=[2,4,5,10,20,25,50,100];
Object.assign(WIDGETS,{
  blocks2:{intro:'10개씩 묶음과 낱개의 수를 바꿔 보세요. 수와 읽는 법이 함께 바뀌어요.',
    init:()=>({t:2,o:3}),
    view:s=>{const n=s.t*10+s.o;return `<div class="stps">${stp('t','10개씩 묶음',s.t)}${stp('o','낱개',s.o)}</div>${tensHtml(s.t,s.o)}<p class="eq">10개씩 묶음 ${s.t}개, 낱개 ${s.o}개 → <b>${n}</b></p>${n?`<p class="note">읽기: ${korean4(n)} / ${nativeNum(n)||korean4(n)}</p>`:''}`;},

  chart100:{intro:'수 배열표에서 수를 눌러 보세요. 1 큰 수, 1 작은 수, 10 큰 수, 10 작은 수가 표시돼요.',

  clock30:{intro:'몇 시를 바꾸고 "30분" 버튼을 눌러 보세요. 짧은바늘과 긴바늘이 어떻게 움직이는지 살펴봐요.',
    init:()=>({h:3,half:false}),
    view:s=>`<div class="stps">${stp('h','몇 시',s.h)}</div><button type="button" class="btn ${s.half?'':'ghost'}" data-act="half" aria-pressed="${s.half}">${s.half?'30분 보는 중':'30분 보기'}</button><div class="viz">${clockSvg(s.h,s.half?30:0,200)}</div><p class="eq"><b>${s.h}시${s.half?' 30분':''}</b></p><p class="note">${s.half?`긴바늘이 6, 짧은바늘이 ${s.h}와(과) ${s.h%12+1} 사이에 있어요.`:`긴바늘이 12, 짧은바늘이 ${s.h}을(를) 가리켜요.`}</p>`,
    step:(k,d,s)=>{s.h=(s.h+d+11)%12+1;},act:(a,el,s)=>{if(a==='half')s.half=!s.half;}},
  clock5:{intro:'시와 분을 바꿔 보세요. 긴바늘이 숫자 한 칸 움직일 때마다 5분이에요.',
    init:()=>({h:2,m:25}),
    view:s=>`<div class="stps">${stp('h','시',s.h)}${stp('m','분',s.m)}</div><div class="viz">${clockSvg(s.h,s.m,200)}</div><p class="eq"><b>${s.h}시 ${s.m}분</b></p><p class="note">긴바늘이 ${s.m/5||12}을(를) 가리키면 ${s.m}분이에요. 긴바늘이 한 바퀴 돌면 60분 = 1시간!</p>`,
    step:(k,d,s)=>{if(k==='h')s.h=(s.h+d+11)%12+1;else{const t=s.m+d*5;if(t>=60){s.m=t-60;s.h=s.h%12+1;}else if(t<0){s.m=t+60;s.h=(s.h+10)%12+1;}else s.m=t;}}},
  blocks3:{intro:'백 모형, 십 모형, 일 모형의 수를 바꿔 보세요. 세 자리 수와 읽는 법이 바뀌어요.',
    init:()=>({h:3,t:4,o:2}),
    view:s=>{const n=s.h*100+s.t*10+s.o;return `<div class="stps">${stp('h','백',s.h)}${stp('t','십',s.t)}${stp('o','일',s.o)}</div><div class="viz">${blocksSvg(s.h,s.t,s.o)}</div><p class="eq"><b>${n}</b> (${koreanNum(n)})</p><p class="note">백의 자리 ${s.h} = ${s.h*100}, 십의 자리 ${s.t} = ${s.t*10}, 일의 자리 ${s.o} = ${s.o}</p>`;},
    step:(k,d,s)=>{s[k]=clamp(s[k]+d,k==='h'?1:0,9);}},
  coladd:mkCol('+'),
  colsub:mkCol('-'),
  gugutable:{intro:'곱셈표에서 단 이름을 눌러 보세요. 그 단이 몇씩 커지는지 확인할 수 있어요.',
    init:()=>({row:7}),
    view:s=>`<div class="gtab-wrap"><table class="gtab"><thead><tr><th>×</th>${[1,2,3,4,5,6,7,8,9].map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${[2,3,4,5,6,7,8,9].map(r=>`<tr class="${r===s.row?'on':''}"><th><button type="button" data-act="row" data-i="${r}" aria-pressed="${r===s.row}">${r}단</button></th>${[1,2,3,4,5,6,7,8,9].map(c=>`<td>${r*c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="eq">${s.row}단은 <b>${s.row}씩</b> 커져요</p><p class="note">${s.row} × 0 = 0, ${s.row} × 1 = ${s.row}. 0을 곱하면 0, 1을 곱하면 그대로예요.</p>`,
    act:(a,el,s)=>{if(a==='row')s.row=+el.dataset.i;}},
  bignum:{intro:'"×10"과 "÷10"을 눌러 수를 바꿔 보세요. 네 자리마다 만, 억, 조로 단위가 바뀌어요.',
    init:()=>({s:'35000000'}),
    view:s=>`${placeChart(s.s)}<p class="eq" style="font-size:1.2rem;overflow-wrap:anywhere">${s.s}</p><p class="eq"><b>${koreanNum(s.s)}</b></p><div class="row"><button type="button" class="btn ghost" data-act="mul" ${s.s.length>=16?'disabled':''}>×10</button><button type="button" class="btn ghost" data-act="div" ${s.s.length<=1?'disabled':''}>÷10</button><button type="button" class="btn ghost" data-act="new">새 수</button></div>`,
    act:(a,el,s)=>{if(a==='mul'&&s.s.length<16)s.s+='0';if(a==='div'&&s.s.length>1)s.s=s.s.slice(0,-1);if(a==='new'){const len=ri(6,13);let t=String(ri(1,9));for(let i=1;i<len;i++)t+=Math.random()<.4?'0':String(ri(1,9));s.s=t;}}},
  partial:{intro:'두 자리 수를 몇십과 몇으로 나눠 곱한 다음 더해요. "다음 단계"를 눌러 보세요.',
    init:()=>({a:ri(102,499),b:ri(12,39),step:0}),
    view:s=>{const o=s.b%10,t=s.b-o;const lines=[`${s.a} × ${s.b}`,`${s.a} × ${o} = ${s.a*o}`,`${s.a} × ${t} = ${s.a*t}`,`${s.a*o} + ${s.a*t} = ${s.a*s.b}`];return `<ol class="steps">${lines.slice(0,s.step+1).map((l,i)=>`<li class="${i===s.step?'now':''}">${l}</li>`).join('')}</ol>${stepRow(s,3,[`${s.b}를 ${t}과 ${o}(으)로 나눠요.`,'먼저 일의 자리 수를 곱해요.',`${t}은 ${t/10}의 10배라서 곱도 10배예요.`,'두 곱을 더하면 답!'])}`;},
    act:(a,el,s)=>{if(a==='next')s.step=Math.min(3,s.step+1);if(a==='new')Object.assign(s,{a:ri(102,499),b:ri(12,39),step:0});}},
  estdiv:{intro:'나누는 수에 몇을 곱해야 나누어지는 수에 가장 가까워지는지 어림해 보세요.',
    init:()=>{let d,q,r,n;do{d=ri(12,49);q=ri(3,30);r=ri(1,d-1);n=d*q+r;}while(n<100||n>999);return {d,q,r,n,step:0};},
    view:s=>{const lines=[`${s.n} ÷ ${s.d}`,`${s.d} × 10 = ${s.d*10}${s.q>=20?`, ${s.d} × 20 = ${s.d*20}`:''}`,`${s.d} × ${s.q} = ${s.d*s.q}, ${s.d} × ${s.q+1} = ${s.d*(s.q+1)} (너무 커요)`,`몫 ${s.q}, 나머지 ${s.n} − ${s.d*s.q} = ${s.r}`,`검산: ${s.d} × ${s.q} + ${s.r} = ${s.n}`];return `<ol class="steps">${lines.slice(0,s.step+1).map((l,i)=>`<li class="${i===s.step?'now':''}">${l}</li>`).join('')}</ol>${stepRow(s,4,['어림부터 해요.','몇십을 곱해서 범위를 좁혀요.','하나씩 늘려 가며 넘지 않는 가장 큰 수를 찾아요.','나머지는 나누는 수보다 작아야 해요.','나누는 수 × 몫 + 나머지 = 나누어지는 수'])}`;},

function mountWidget(root,spec){
  const st=spec.init();
  const render=focusSel=>{root.innerHTML=fixJosa(spec.view(st));if(focusSel){const el=root.querySelector(focusSel);if(el&&!el.disabled)el.focus({preventScroll:true});}};
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-k]');
    if(b&&root.contains(b)){spec.step(b.dataset.k,+b.dataset.d,st);render(`[data-k="${b.dataset.k}"][data-d="${b.dataset.d}"]`);return;}
    const t=e.target.closest('[data-act]');
    if(t&&root.contains(t)&&spec.act){spec.act(t.dataset.act,t,st);render(t.dataset.i!=null?`[data-act="${t.dataset.act}"][data-i="${t.dataset.i}"]`:`[data-act="${t.dataset.act}"]`);}
  });
  render();
}

const PRAISE=['정답!','최고야!','완벽해!','바로 그거야!','천재 등장!','멋지다!'];
function ansHtml(p){
  const inp=(id,cls='')=>`<input class="ans ${cls}" id="${id}" inputmode="numeric" pattern="[0-9]*" aria-label="${{ans:'답',an:'분자',ad:'분모',aw:'자연수 부분',aq:'몫',ar:'나머지'}[id]}">`;
  const go='<button class="btn" type="submit">확인</button>';
  if(p.type==='choice')return `<div class="opts">${p.opts.map((o,i)=>`<button type="button" class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
  if(p.type==='num')return `${inp('ans')}${go}`;
  if(p.type==='frac')return `<span class="frin">${inp('an','sm')}<hr>${inp('ad','sm')}</span>${go}`;
  if(p.type==='mixed')return `${inp('aw','sm')}<span class="frin">${inp('an','sm')}<hr>${inp('ad','sm')}</span>${go}`;
  if(p.type==='qr')return `<span class="qlab">몫</span>${inp('aq','sm')}<span class="qlab">나머지</span>${inp('ar','sm')}${go}`;

function readAns(p,root){
  const v=id=>{const el=$('#'+id,root);const s=el?el.value.replace(/[^0-9]/g,''):'';return s===''?NaN:Number(s);};
  if(p.type==='text'){const el=$('#ans',root);const v=el?el.value:'';if(!v.trim())return null;const nz=t=>{t=String(t).replace(/[’‘]/g,"'").trim().replace(/\s+/g,' ');return p.en?t.toLowerCase().replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim():t.replace(/[.!?]$/,'');};return p.a.some(x=>nz(x)===nz(v));}
  if(p.type==='dec'){const el=$('#ans',root);const t=el?el.value.replace(/[^0-9.]/g,''):'';if(!t||t==='.')return null;return Math.abs(Number(t)-p.a)<1e-9;}
  const ids=p.type==='multi'?p.labels.map((_,i)=>'am'+i):{num:['ans'],frac:['an','ad'],mixed:['aw','an','ad'],qr:['aq','ar']}[p.type];
  const vals=ids.map(v);
  if(vals.some(isNaN))return null;
  if(p.type==='frac'&&!p.strict)return vals[1]>0&&vals[0]*p.a[1]===vals[1]*p.a[0];
  if(p.type==='mixed'&&!p.strict)return vals[2]>0&&vals[1]<vals[2]&&(vals[0]*vals[2]+vals[1])*p.a[2]===(p.a[0]*p.a[2]+p.a[1])*vals[2];
  return p.type==='num'?vals[0]===p.a:vals.every((x,i)=>x===p.a[i]);
}

function meCard(){const lv=levelOf(P.xp),a=lv>1?xpFor(lv-1):0,b=xpFor(lv),pct=Math.round((P.xp-a)/(b-a)*100),nb=Object.keys(P.badges).length;

/* ---------- 문제 풀이 (콤보·경험치·도전 하트) ---------- */
function runQuiz(root,problems,onDone,ctx={}){
  const st={i:0,tries:0,first:0,solved:0,locked:false,missed:[],t0:Date.now(),combo:0,maxRun:0,hearts:ctx.challenge?3:null,failed:false,xp:0};
  const heartsHtml=()=>st.hearts===null?'':`<span class="hearts" aria-label="하트 ${st.hearts}개">${'❤️'.repeat(st.hearts)}${'🤍'.repeat(3-st.hearts)}</span>`;
  const comboHtml=()=>st.combo>=2?`<span class="combo">🔥 ${st.combo}콤보</span>`:'';
  const end=()=>{CUR.p=null;refreshAsk();if(ctx.id){addLog(ctx.id,st.first,problems.length,(Date.now()-st.t0)/1000);markDay();}addXP(st.xp);save();onDone(st,problems.length);checkBadges();updateHeader();};
  const draw=()=>{
    if(st.i>=problems.length){end();return;}
    const p=problems[st.i];
    Object.assign(CUR,{p,idx:st.i+1,total:problems.length,tries:0,locked:false});refreshAsk();
    root.innerHTML=`<div class="qcard ${ctx.challenge?'chal':''}" id="qcard"><div class="qtop"><span>${ctx.challenge?'도전 ':''}문제 ${st.i+1} / ${problems.length}</span>${heartsHtml()}<span class="combo-slot">${comboHtml()}</span><button type="button" class="say" data-say="q" aria-label="문제 읽어 주기">${SPEAKER}</button>${ctx.challenge?'':`<button type="button" class="askq" data-ask>${face('semi','happy')}셈이에게 물어보기</button>`}<span class="pips">${problems.map((_,j)=>`<i class="${j<st.i?'done':j===st.i?'now':''}"></i>`).join('')}</span></div><div class="qtext">${p.listen?`<div class="listen-row"><button type="button" class="btn listen" data-speak="${esc(p.listen.t)}" data-lang="${p.listen.lang}">${SPEAKER} 소리 듣기</button><button type="button" class="btn ghost reveal" data-reveal="${esc(p.listen.t)}">소리가 안 나와요 · 부모님이 읽어 주기</button><span class="reveal-box" hidden></span></div>`:''}${p.q}</div><form class="qans" id="qform" autocomplete="off">${ansHtml(p)}</form><div class="fb" id="fb" aria-live="polite"></div><div class="row" id="qnext"></div></div>`;
    $('#qform',root).addEventListener('submit',e=>{e.preventDefault();submit();});
    root.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>submit(+b.dataset.i,b)));
    const ak=$('[data-ask]',root);if(ak)ak.addEventListener('click',()=>openAsk());
    if(p.listen&&st.i>0)speak(p.listen.t,p.listen.lang);
    else if(P.autoRead&&document.body.classList.contains('low')&&st.i>0)speak(sayText(p.q));
  };
  function submit(choice,btn){
    if(st.locked)return;
    const p=problems[st.i],fb=$('#fb',root);
    let ok;
    if(p.type==='choice')ok=choice===p.a;
    else{ok=readAns(p,root);if(ok===null){fb.className='fb warn';fb.textContent=p.type==='text'?'답을 써 줘!':'빈칸에 숫자를 모두 써 줘!';return;}}
    if(ok){
      if(st.tries===0){st.first++;st.combo++;st.maxRun=Math.max(st.maxRun,st.combo);P.maxCombo=Math.max(P.maxCombo,st.combo);st.xp+=10+(st.combo>=3?Math.min(st.combo,10)*2:0);}else{st.xp+=4;}
      st.solved++;P.correct++;st.locked=true;
      if(btn)btn.classList.add('right');
      const praise=st.tries===0&&st.combo>=3?`${st.combo}연속 정답! ${pick(['불타오른다!','멈출 수 없어!','대단해!','천재 등장!'])}`:pick(PRAISE);
      fb.className='fb ok';fb.innerHTML=`<b>${praise}</b>${p.ex}`;burst(fb);
      const cs=$('.combo-slot',root);if(cs)cs.innerHTML=comboHtml();
      finish();
    }else if(ctx.challenge){
      st.tries++;st.combo=0;st.hearts--;st.locked=true;CUR.tries=st.tries;
      if(btn)btn.classList.add('wrong');
      fb.className='fb bad';fb.innerHTML=`<b>${st.hearts>0?'앗! 하트가 하나 줄었어요.':'하트를 모두 썼어요.'}</b>정답은 ${p.show}. ${p.ex}`;
      if(p.type==='choice')root.querySelectorAll('.opt')[p.a].classList.add('right');
      const hs=$('.hearts',root);if(hs)hs.outerHTML=heartsHtml();
      if(st.hearts<=0)st.failed=true;
      finish();
    }else{
      st.tries++;st.combo=0;CUR.tries=st.tries;
      const cs=$('.combo-slot',root);if(cs)cs.innerHTML='';
      if(btn){btn.classList.add('wrong');btn.disabled=true;}
      if(st.tries===1){fb.className='fb hint';fb.innerHTML=`<b>${pick(['앗, 다시 생각해 볼까?','거의 다 왔어!','한 번 더 해 보자!'])}</b>셈이의 힌트: ${p.hint}`;}
      else{st.locked=true;fb.className='fb bad';fb.innerHTML=`<b>정답은 ${p.show}</b>${p.ex}`;if(p.type==='choice')root.querySelectorAll('.opt')[p.a].classList.add('right');finish();}
    }
  }
  function finish(){
    CUR.tries=st.tries;CUR.locked=true;refreshAsk();
    const p=problems[st.i];
    if(ctx.id){if(st.tries>0){st.missed.push(p);if(!ctx.review)addWrong(ctx.id,p);}else if(ctx.review){const n=P.wrong.length;P.wrong=P.wrong.filter(w=>w.p.q!==p.q);if(P.wrong.length<n)P.cleared++;}save();}
    root.querySelectorAll('#qform input, #qform button').forEach(x=>x.disabled=true);
    const b=document.createElement('button');b.type='button';b.className='btn';
    const last=st.failed||st.i===problems.length-1;
    b.textContent=last?'결과 보기':'다음 문제';
    b.addEventListener('click',()=>{if(st.failed)st.i=problems.length;else st.i++;st.tries=0;st.locked=false;draw();const c=$('#qcard',root)||root;c.scrollIntoView({block:'start',behavior:reduceMotion()?'auto':'smooth'});const f=root.querySelector('#qform input, .opt');if(f)f.focus({preventScroll:true});});
    $('#qnext',root).appendChild(b);b.focus({preventScroll:true});
  }
  draw();
}

function renderDaily(){
  const d=today(),done=P.daily[d]!=null;
  const pool=LESSONS.filter(l=>P.stars[l.id]);
  const s=curSubj(),src=pool.length>=3?pool:lessonsOfGrade(gradeInfo(s,P.grade)?P.grade:subjOf(s).grades[0].g,s);
  const probs=seeded(hashStr(d+PROF),()=>shuffle(src).concat(shuffle(src)).slice(0,5).map(l=>{const ps=l.quiz().filter(p=>!p.listen);return Object.assign({},pick(ps.length?ps:l.quiz()),{from:l.t});}));
  app.innerHTML=`<nav class="crumb"><a href="#home">모험 지도</a><span>›</span><span>오늘의 도전</span></nav>
  <header class="ghead" style="--rc:var(--castle)"><span class="tag">🎯 ${d}</span><h1>오늘의 도전</h1><p>${pool.length>=3?'지금까지 푼 화에서 골라 낸 오늘의 5문제예요.':'아직 푼 화가 적어서, 지금 학년의 문제로 골랐어요.'} ${done?'오늘은 이미 해냈어요. 다시 풀어도 돼요(보너스는 하루 한 번).':'끝까지 풀면 보너스 경험치 40을 받아요.'} 연속 학습 🔥 ${streak()}일</p></header>
  <section><div id="quiz"></div></section>`;

/* ---------- read aloud ---------- */
// 1) The 오늘우리집 app can hand speech to the phone's own TTS through a bridge (Android WebView has no working Web Speech).
// 2) Otherwise the browser's speechSynthesis, with workarounds for its known quirks.
// 3) If neither makes a sound, say so once and let a grown-up read listening questions aloud.
const CAN_SPEAK='speechSynthesis' in window&&typeof SpeechSynthesisUtterance==='function';
const TTS={voices:[],started:false,failed:false,told:false,unlocked:false,timer:null,retryTimer:null};
function ttsBridge(){
  try{
    if(window.TodayTTS&&typeof window.TodayTTS.postMessage==='function')return m=>window.TodayTTS.postMessage(JSON.stringify(m)); // webview_flutter JavaScriptChannel
    if(window.flutter_inappwebview&&typeof window.flutter_inappwebview.callHandler==='function')return m=>window.flutter_inappwebview.callHandler('tts',m);
    if(window.ReactNativeWebView&&typeof window.ReactNativeWebView.postMessage==='function')return m=>window.ReactNativeWebView.postMessage(JSON.stringify(Object.assign({source:'learn'},m)));
    if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.tts)return m=>window.webkit.messageHandlers.tts.postMessage(m);
  }catch(e){}
  return null;
}
function sayText(html){
  return plain(html).replace(/\(\d+\/\d+\)/g,'').replace(/×/g,' 곱하기 ').replace(/÷/g,' 나누기 ').replace(/−/g,' 빼기 ').replace(/\+/g,' 더하기 ').replace(/=/g,' 는 ').replace(/□/g,' 네모 ').replace(/○/g,' 동그라미 ').replace(/\[그림:[^\]]*\]/g,'').replace(/\s+/g,' ').trim();
}
function loadVoices(){try{TTS.voices=speechSynthesis.getVoices()||[];}catch(e){TTS.voices=[];}return TTS.voices;}
if(CAN_SPEAK){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices);}catch(e){}}
if(!CAN_SPEAK&&!ttsBridge())document.documentElement.classList.add('no-tts');
function pickVoice(lang){
  const vs=TTS.voices.length?TTS.voices:loadVoices(),L=lang.toLowerCase().replace('_','-'),pre=L.slice(0,2);
  const norm=v=>String(v.lang||'').toLowerCase().replace('_','-');
  return vs.find(v=>norm(v)===L&&v.localService)||vs.find(v=>norm(v)===L)||vs.find(v=>norm(v).startsWith(pre))||null;
}
function ttsFail(msg){
  TTS.failed=true;document.documentElement.classList.add('tts-fail');
  if(!TTS.told){TTS.told=true;toast(msg||'🔇 이 기기에서는 소리가 나오지 않아요. 듣기 문제는 "부모님이 읽어 주기"를 눌러 주세요.');}
}
// Chrome stops long utterances after ~15s, so read sentence by sentence.
const chunks=t=>String(t).replace(/([.!?。])\s+/g,'$1\n').split('\n').flatMap(x=>x.length>140?x.match(/.{1,140}(\s|$)/g)||[x]:[x]).map(x=>x.trim()).filter(Boolean);
const UA=navigator.userAgent||'';
const IS_IOS=/iPad|iPhone|iPod/.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1);
const IS_ANDROID_WEBVIEW=/Android/.test(UA)&&/; wv\)/.test(UA);
function speak(texts,lang='ko-KR'){
  const list=[].concat(texts).filter(Boolean).flatMap(chunks);if(!list.length)return;
  const br=ttsBridge();
  if(br){try{br({type:'speak',text:list.join(' '),lang});return;}catch(e){}}
  // an Android app screen without the TTS bridge never makes a sound: say so right away
  if(!CAN_SPEAK||(IS_ANDROID_WEBVIEW&&!TTS.started)){ttsFail(IS_ANDROID_WEBVIEW?'🔇 앱 화면에서는 아직 소리가 나오지 않아요. 듣기 문제는 "부모님이 읽어 주기"를 눌러 주세요.':undefined);return;}
  const run=(useVoice)=>{
    try{
      speechSynthesis.resume();
      const v=useVoice?pickVoice(lang):null;
      let retried=false;
      const retry=()=>{if(retried||!useVoice||TTS.started)return;retried=true;try{speechSynthesis.cancel();}catch(e){}setTimeout(()=>run(false),60);};
      list.forEach((t,k)=>{const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=lang.startsWith('en')?.85:.92;u.volume=1;if(v)u.voice=v;
        if(k===0)u.onstart=()=>{TTS.started=true;clearTimeout(TTS.timer);clearTimeout(TTS.retryTimer);document.documentElement.classList.remove('tts-fail');};
        // Android lists voices that are not downloaded; speaking with one fails, so retry once with the language only
        u.onerror=e=>{const er=(e&&e.error)||'';if(er==='interrupted'||er==='canceled')return;if(useVoice&&v&&!TTS.started){retry();return;}if(/not-allowed|synthesis-unavailable|synthesis-failed|audio-hardware|language-unavailable|voice-unavailable/.test(er))ttsFail();};
        speechSynthesis.speak(u);});
      if(!TTS.started){
        clearTimeout(TTS.retryTimer);if(useVoice&&v)TTS.retryTimer=setTimeout(retry,2500);
        // the first utterance on Android can take a few seconds while the engine starts
        clearTimeout(TTS.timer);TTS.timer=setTimeout(()=>{if(!TTS.started)ttsFail();},7000);
      }
    }catch(e){ttsFail();}
  };
  let busy=false;try{busy=speechSynthesis.speaking||speechSynthesis.pending;speechSynthesis.cancel();}catch(e){}
  if(busy)setTimeout(()=>run(true),80);else run(true);
}

// A worksheet is generated from a set number (seed), so the problem sheet and the answer sheet always match.
const CAN_PRINT=!window.claude;
function seeded(seed,fn){
  const orig=Math.random;let a=(seed>>>0)||1;
  Math.random=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};
  try{return fn();}finally{Math.random=orig;}
}
function sheetSource(id){
  const L=LESSONS.find(l=>l.id===id);
  const uniq=(gen,count)=>{const out=[],seen=new Set();for(let round=0;round<8&&out.length<count;round++)for(const p of gen()){const key=p.q+'|'+p.show;if(!seen.has(key)&&out.length<count){seen.add(key);out.push(p);}}return out;};
  if(L){const r=R[L.r],no=lessonsOf(L.r).indexOf(L)+1;return {kind:'lesson',title:`${no}화. ${L.t}`,sub:`${subjLabel(r.s)} ${r.g}학년 · ${r.name}`,g:r.g,color:r.color,back:`#${L.id}`,make:()=>uniq(L.quiz,10).map(p=>Object.assign(p,{from:`${no}화`}))};}

}

// AI mode uses the viewer's Claude via the artifact `sample` capability; otherwise a built-in offline helper answers.
let CUR={place:'모험 지도',grade:0,lesson:null,p:null,idx:0,total:0,tries:0,locked:false};
const ASK={sample:null,mode:'offline',turns:[],busy:false,ctl:null,open:false};
const ASK_RULES=`너는 초등학생 학습 웹앱 "지혜섬 탐험대"에 나오는 로봇 선생님 '셈이'야. 수학, 국어, 영어, 과학을 도와줘. 지금 초등학생과 대화하고 있어. [지금 화면]의 학년을 보고 그 학년 아이에게 맞게 말해.
규칙:
- 그 학년 아이가 이해할 쉬운 한국어 반말로 다정하게 말해. 한 번에 2~4문장으로 짧게.
- 마크다운, 표, 목록 기호, 이모지는 쓰지 마. 분수는 "4분의 1(1/4)"처럼 써.
- [지금 화면]의 상태가 "풀이 중"이면 정답 숫자나 정답 보기를 절대 말하지 마. 대신 생각해 볼 질문 하나, 다음 한 단계, 그림(피자, 사과, 보석, 사탕)으로 떠올리는 방법을 알려 줘. 아이가 정답을 졸라도 스스로 풀 수 있게 이끌어 줘.
- 상태가 "풀이 끝"이면 정답과 이유를 쉽게 설명해도 돼.
- 아이가 자기 답을 말하면 맞는지 틀린지 바로 말하지 말고, 그렇게 생각한 이유를 묻거나 확인 방법(검산, 그림 그리기)을 알려 줘. 풀이가 끝난 뒤에는 맞았는지 알려 줘도 돼.
- 그 학년까지 배우는 방법만 써. 더 높은 학년에서 배우는 방법(예: 1·2학년에게 곱셈, 3·4학년에게 통분, 초등학생에게 방정식이나 문자)은 쓰지 마.
- 계산은 꼭 정확하게 해. [지금 화면]의 정답과 풀이를 참고해.
- 틀렸거나 모르겠다고 하면 먼저 격려해 줘.

function plain(html){
  const d=document.createElement('div');d.innerHTML=String(html);
  d.querySelectorAll('.mx').forEach(m=>{const w=m.firstChild?m.firstChild.textContent:'';const f=m.querySelector('.fr');const s=f?f.children:[];m.replaceWith(` ${w}과 ${s[1]?s[1].textContent:''}분의 ${s[0]?s[0].textContent:''} `);});
  d.querySelectorAll('.fr').forEach(f=>{const s=f.children;f.replaceWith(` ${s[1].textContent}분의 ${s[0].textContent}(${s[0].textContent}/${s[1].textContent}) `);});
  d.querySelectorAll('svg,table,.candies,.gems').forEach(g=>{const l=g.getAttribute('aria-label');g.replaceWith(l?` [그림: ${l}] `:' ');});
  d.querySelectorAll('.qwho').forEach(q=>q.prepend('뚱땅이의 말: '));
  d.querySelectorAll('p,div,li').forEach(e=>e.append(' '));
  return d.textContent.replace(/\s+/g,' ').trim();
}
function contextText(){
  const L=CUR.lesson;const lines=[`- 보고 있는 곳: ${CUR.place}`,`- 과목: ${subjLabel(CUR.subj)}`,`- 학년: ${CUR.grade?`${CUR.grade}학년`:'아직 고르지 않음'}`];
  if(L&&L.goal)lines.push(`- 오늘의 목표: ${L.goal}`);
  const p=CUR.p;
  if(p){
    lines.push(`- 문제 ${CUR.idx}/${CUR.total}: ${plain(p.q)}`);
    if(p.type==='choice')lines.push(`- 보기: ${p.opts.map((o,i)=>`${i+1}) ${plain(o)}`).join(', ')}`);
    lines.push(`- 상태: ${CUR.locked?'풀이 끝':`풀이 중 (지금까지 ${CUR.tries}번 틀림)`}`);
    lines.push(`- 정답(참고용${CUR.locked?'':', 풀이 중이니 절대 말하지 말 것'}): ${plain(p.show)}`);
    lines.push(`- 앱의 힌트: ${plain(p.hint)}`);
    lines.push(`- 앱의 풀이${CUR.locked?'':'(참고용, 말하지 말 것)'}: ${plain(p.ex)}`);
  }else lines.push('- 지금은 문제를 풀고 있지 않아.');
  return lines.join('\n');
}

function offlineReply0(q){

  if(p&&/(힌트|모르겠|어떻게|시작|도와)/.test(q))return CUR.locked?`이 문제는 이렇게 풀어. ${plain(p.ex)}`:`힌트야! ${plain(p.hint)}`;
  if(p&&CUR.locked&&/(왜|이유|답)/.test(q))return `풀이를 같이 볼까? ${plain(p.ex)}`;
  if(p&&!CUR.locked&&/(답|정답)/.test(q))return `정답은 네가 직접 찾아야 더 똑똑해져! 대신 힌트를 줄게. ${plain(p.hint)}`;
  if(/(비슷|문제 내|또)/.test(q))return '"다시 도전"을 누르면 숫자가 바뀐 새 문제가 나와! 대장 문제에서는 여러 화의 문제가 섞여서 나와.';
  if(p&&/(뜻|무슨)/.test(q))return `문제를 천천히 다시 읽어 보자. ${plain(p.q)} 무엇을 구하라고 하는지 먼저 찾아봐!`;
  for(const [re,a] of FAQ)if(re.test(q))return a;
  if(p&&!CUR.locked)return `좋은 질문이야! 우선 이 힌트부터 생각해 볼까? ${plain(p.hint)}`;
  return '음, 그 질문은 내가 아직 잘 몰라. "분모", "나머지", "올림" 같은 말을 넣어서 다시 물어봐 줄래?';
}

  const p=CUR.p;
  $('#askCtx').textContent=`지금 보는 곳: ${CUR.place}${p?` · 문제 ${CUR.idx}${CUR.locked?' (풀이 끝)':''}`:''}`;
  const GCH={1:['가르기가 뭐야?','10 만들기 알려 줘','시계 보는 법 알려 줘'],2:['받아올림이 뭐야?','구구단 쉽게 외우는 법','몇 배가 뭐야?'],3:['분모랑 분자가 뭐야?','나머지는 왜 작아야 해?','올림이 뭐야?'],4:['큰 수 읽는 법','소수점 맞추는 법','대분수 빼기 방법'],5:['약수가 뭐야?','통분이 뭐야?','반올림이 뭐야?'],6:['비율이 뭐야?','백분율이 뭐야?','원의 넓이 구하는 법']};
  const chips=p?(CUR.locked?['왜 이게 답이야?','다른 방법도 있어?','비슷한 문제 내 줘']:['힌트 줘','어디서부터 시작해?','이 문제 무슨 뜻이야?']):(CUR.subj&&CUR.subj!=='math'?(SUBJ_CHIPS[CUR.subj]||GCH[3]):(GCH[CUR.grade]||GCH[3]));
  $('#askChips').innerHTML=chips.map(c=>`<button type="button">${c}</button>`).join('');
}
function setAskMode(){$('#askMode').textContent=ASK.mode==='ai'?'AI 셈이 · 질문하면 생각해서 대답해요':'기본 도움말 · 낱말로 물어보면 알려 줘요';}
function openAsk(){
  ASK.open=true;$('#askPanel').hidden=false;$('#askFab').hidden=true;$('#askFab').setAttribute('aria-expanded','true');
  if(!$('#askLog').children.length)askMsg('semi','안녕! 나는 셈이야. 문제를 풀다가 막히면 뭐든 물어봐. 정답을 바로 알려 주지는 않지만, 네가 풀 수 있게 꼭 도와줄게!');
  refreshAsk();setAskMode();$('#askIn').focus();
}
function closeAsk(){
  if(ASK.ctl)ASK.ctl.abort();
  ASK.open=false;$('#askPanel').hidden=true;$('#askFab').hidden=false;$('#askFab').setAttribute('aria-expanded','false');$('#askFab').focus();
}
function askBusy(on){ASK.busy=on;$('#askGo').hidden=on;$('#askStop').hidden=!on;$('#askIn').disabled=on;if(!on)$('#askIn').focus();}
async function askSend(raw){
  const text=String(raw||'').trim().slice(0,200);
  if(!text||ASK.busy)return;
  askMsg('kid',text);$('#askIn').value='';
  if(ASK.mode!=='ai'||!ASK.sample){askMsg('semi',offlineReply(text));return;}
  const bubble=askMsg('semi','셈이가 생각하는 중…',true);
  const ctl=ASK.ctl=new AbortController();askBusy(true);
  const input=[{role:'user',content:ASK_RULES},...ASK.turns.slice(-8),{role:'user',content:`[지금 화면]\n${contextText()}\n\n[아이의 질문]\n${text}`}];
  try{
    const r=await ASK.sample(input,{modelTier:'quick',cache:false,signal:ctl.signal,onText:({text:t})=>{bubble.classList.remove('wait');bubble.textContent=t;$('#askLog').scrollTop=$('#askLog').scrollHeight;}});
    bubble.classList.remove('wait');bubble.textContent=r.text;
    ASK.turns.push({role:'user',content:text},{role:'assistant',content:r.text});
  }catch(e){
    const code=e&&e.code,kept=e&&e.text?e.text+'\n\n':'';
    bubble.classList.remove('wait');
    if(code==='cancelled')bubble.textContent=e.text||'(멈췄어)';
    else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){ASK.mode='offline';setAskMode();bubble.textContent=offlineReply(text)+'\n\n(지금은 AI 셈이를 쓸 수 없어서 기본 도움말로 대답했어.)';}
    else if(code==='rate_limited')bubble.textContent=kept+'질문이 많아서 셈이가 잠깐 쉬어야 해. 조금 있다가 다시 물어봐 줘.';
    else if(code==='session_expired')bubble.textContent='다시 로그인해야 셈이가 대답할 수 있어. 부모님께 도와 달라고 해 줘.';
    else if(code==='refused')bubble.textContent='그 이야기는 내가 도와주기 어려워. 수학 문제로 돌아가 볼까?';
    else bubble.textContent=kept+'앗, 연결이 잠깐 끊겼어. 다시 보내 줄래?';
  }finally{if(ASK.ctl===ctl)ASK.ctl=null;askBusy(false);}
}
document.querySelectorAll('.ask-face').forEach(s=>s.innerHTML=face('semi','happy'));
$('#askFab').addEventListener('click',openAsk);
$('#askClose').addEventListener('click',closeAsk);
$('#askStop').addEventListener('click',()=>{if(ASK.ctl)ASK.ctl.abort();});
$('#askForm').addEventListener('submit',e=>{e.preventDefault();askSend($('#askIn').value);});
$('#askChips').addEventListener('click',e=>{const b=e.target.closest('button');if(b)askSend(b.textContent);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ASK.open)closeAsk();});
(async()=>{try{if(window.claude&&typeof claude.use==='function'){const s=await claude.use('sample');if(s){ASK.sample=s;ASK.mode='ai';setAskMode();}}}catch(e){}})();

function route(){
  if(SPEED_TIMER){clearInterval(SPEED_TIMER);SPEED_TIMER=null;}
  const h=decodeURIComponent(location.hash.slice(1))||'home';
  const sm=/^(ws|ans)-(.+)-(\d{1,9})$/.exec(h);
  if(sm&&sheetSource(sm[2])){const src=sheetSource(sm[2]);CUR={place:`${src.title} ${sm[1]==='ws'?'문제지':'풀이지'}`,grade:src.g,lesson:null,p:null,idx:0,total:0,tries:0,locked:false};renderSheet(sm[1],sm[2],+sm[3]);updateHeader();refreshAsk();window.scrollTo(0,0);return;}
  const L=LESSONS.find(l=>l.id===h);
  const boss=h.endsWith('-boss')&&R[h.slice(0,-5)]?h.slice(0,-5):null;
  const gm=/^(?:(kor|eng|sci)-)?g([1-6])$/.exec(h),gms=gm?(gm[1]||'math'):null,gmOk=gm&&gradeInfo(gms,+gm[2]);
  const gr=L?R[L.r].g:boss?R[boss].g:gmOk?+gm[2]:(P.grade||0),sj=L?(R[L.r].s||'math'):boss?(R[boss].s||'math'):gmOk?gms:curSubj();
  CUR={subj:sj,place:L?`${subjLabel(sj)} ${gr}학년 ${R[L.r].name} ${lessonsOf(L.r).indexOf(L)+1}화 "${L.t}"`:boss?`${subjLabel(sj)} ${gr}학년 ${R[boss].name} 대장 문제`:gmOk?`${subjLabel(sj)} ${gr}학년 지도`:'모험 지도',grade:gr,lesson:L||(boss?{goal:`${R[boss].name}에서 배운 내용을 섞은 대장 문제`}:null),p:null,idx:0,total:0,tries:0,locked:false};
  const spm=/^speed-(math|kor|eng|sci)-g([1-6])$/.exec(h),spOk=spm&&gradeInfo(spm[1],+spm[2]);
  const subjPage=SUBJECTS.some(x=>x.id===h)?h:null;
  if(spOk){CUR.subj=spm[1];CUR.grade=+spm[2];CUR.place=`${subjLabel(spm[1])} ${spm[2]}학년 스피드 도전`;}
  if(subjPage){CUR.subj=subjPage;CUR.place=`${subjLabel(subjPage)} 과목 페이지`;}
  if(h==='review'){CUR.place='오답 노트';renderReview();}else if(h==='report'){CUR.place='학습 기록';renderReport();}
  else if(h==='trophy'){CUR.place='트로피 방';renderTrophy();}else if(h==='daily'){CUR.place='오늘의 도전';renderDaily();}
  else if(spOk)renderSpeed(spm[1],+spm[2]);else if(subjPage)renderSubject(subjPage);
  else if(L)renderLesson(L);else if(boss)renderBoss(boss);else if(gmOk)renderGrade(+gm[2],gms);else renderHome();
  document.body.classList.toggle('low',!!CUR.grade&&CUR.grade<=2);
  updateHeader();refreshAsk();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
syncInit();
</script>
