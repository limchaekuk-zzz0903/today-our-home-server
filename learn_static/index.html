<!doctype html><!--SA-->
<html lang="ko"><!--SA-->
<head><!--SA-->
<meta charset="utf-8"><!--SA-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--SA-->
<meta name="theme-color" content="#1B2140"><!--SA-->
<link rel="manifest" href="manifest.webmanifest"><!--SA-->
<link rel="icon" href="icon.svg" type="image/svg+xml"><!--SA-->
<link rel="apple-touch-icon" href="icon-192.png"><!--SA-->
<title>숫자섬 수학 탐험대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: comic-book pages on dotted paper — a tower hero, a winding three-region map, and lesson pages that run 만화 → 해 보기 → 문제. */
:root{
  --paper:#F2F4FB; --paper2:#E6EAF7; --dot:#D9DEEF; --panel:#FFFFFF;
  --ink:#1B2140; --ink2:#4E5677; --line:#1B2140; --shadow:#1B2140; --feat:#1B2140;
  --bar:#1B2140; --barfg:#FFFFFF;
  --forest:#1C9466; --cave:#5650D0; --castle:#E8552F; --sun:#FFC23A; --onsun:#1B2140; --sky:#7FD0FF; --onrc:#FFFFFF;
  --sea:#1F72B0; --berry:#B03671; --teal:#0C7A70;
  --bubble:#FFFFFF; --trickbg:#F4EEFF; --narr:#FFF0B3; --ok:#14865A; --bad:#C9303F; --hintbg:#FFF6D6;
  --skin:#FFD6B3; --hair:#2B2F4A; --cheek:#FF8FA3; --trick:#9A68DF; --muzzle:#F6EEFF; --robot:#9AD9FF; --screen:#1B2140;
  --slice:#FFFFFF; --cdy:#FFC23A;
  --f-display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-hand:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',cursive;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12162A; --paper2:#1B2140; --dot:#1E2442; --panel:#1C2240;
  --ink:#ECEFFA; --ink2:#AEB5D6; --line:#DDE2F5; --shadow:#04060E; --feat:#1B2140;
  --bar:#0B0E1F; --barfg:#ECEFFA;
  --forest:#2AB07C; --cave:#7C76F0; --castle:#F26A45; --sun:#FFC94D; --onsun:#1B2140; --sky:#8FD8FF; --onrc:#FFFFFF;
  --sea:#3488CC; --berry:#C24A86; --teal:#1A9488;
  --bubble:#262D52; --trickbg:#2E2852; --narr:#3B3418; --ok:#4FD39B; --bad:#FF7482; --hintbg:#3B3418;
  --slice:#2A3158; --cdy:#FFC94D; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#12162A; --paper2:#1B2140; --dot:#1E2442; --panel:#1C2240;
  --ink:#ECEFFA; --ink2:#AEB5D6; --line:#DDE2F5; --shadow:#04060E; --feat:#1B2140;
  --bar:#0B0E1F; --barfg:#ECEFFA;
  --forest:#2AB07C; --cave:#7C76F0; --castle:#F26A45; --sun:#FFC94D; --onsun:#1B2140; --sky:#8FD8FF; --onrc:#FFFFFF;
  --sea:#3488CC; --berry:#C24A86; --teal:#1A9488;
  --bubble:#262D52; --trickbg:#2E2852; --narr:#3B3418; --ok:#4FD39B; --bad:#FF7482; --hintbg:#3B3418;
  --slice:#2A3158; --cdy:#FFC94D; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);background-size:16px 16px;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--barfg)}
.top-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-display);font-size:1.2rem;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo svg{width:28px;height:28px}
.stat{display:flex;align-items:center;gap:14px;font-family:var(--f-display)}
.stat .crs{display:flex;gap:3px}
.stat .crs svg{width:20px;height:24px}
.stat .st{display:flex;align-items:center;gap:4px}
.stat .st svg{width:20px;height:20px}

.wrap{max-width:1000px;margin:0 auto;padding-block:24px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:40px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.sec::before{content:"";width:14px;height:14px;background:var(--sun);border:3px solid var(--line);transform:rotate(45deg);flex:none}

/* buttons */
.btn{font-family:var(--f-display);font-size:1.08rem;line-height:1.2;border:3px solid var(--line);background:var(--sun);color:var(--onsun);border-radius:12px;padding:.6em 1.1em;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;background:var(--panel);border:3px solid var(--line);box-shadow:7px 7px 0 var(--shadow);border-radius:6px;padding:28px}
.eyebrow{font-family:var(--f-display);color:var(--castle);letter-spacing:.06em;font-size:.95rem}
.hero h1{font-size:clamp(2.1rem,6vw,3.4rem);margin-block:6px 12px}
.hero h1 em{font-style:normal;color:var(--castle);-webkit-text-stroke:0}
.lead{font-size:1.08rem;max-width:34em;color:var(--ink2)}
.hero .row{margin-top:18px}
.sync{margin-top:12px;display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:.92rem;background:var(--paper2);border:2px solid var(--forest);color:var(--ink);border-radius:999px;padding:3px 12px}
.sync::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--forest)}
.hero-art{display:flex;justify-content:center}
.hero-art svg{width:100%;max-width:260px;height:auto}
.hands{transform-origin:130px 112px}
.tower-on .hands{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:640px){.hero{grid-template-columns:1fr;padding:20px}.hero-art{order:-1}.hero-art svg{max-width:180px}}

/* comic */
.comic{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px}
.pn{background:var(--panel);border:3px solid var(--line);border-radius:4px;box-shadow:5px 5px 0 var(--shadow);padding:14px;display:flex;gap:12px;align-items:flex-start;min-width:0;margin:0;animation:pop .35s ease-out both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes pop{from{transform:translateY(6px) scale(.98)}}
.av{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;gap:2px}
.ch{width:74px;height:74px;display:block}
.who{font-family:var(--f-display);font-size:.85rem;color:var(--ink2)}
.bub{position:relative;flex:1;min-width:0;background:var(--bubble);border:2.5px solid var(--line);border-radius:18px;padding:10px 14px;font-family:var(--f-hand);font-weight:700;font-size:1.28rem;line-height:1.45;margin-top:4px}
.bub::before{content:"";position:absolute;left:-9px;top:20px;width:14px;height:14px;background:inherit;border-left:2.5px solid var(--line);border-bottom:2.5px solid var(--line);transform:rotate(45deg)}
.pn.ttung .bub{background:var(--trickbg)}
.pn.narr{background:var(--narr);font-family:var(--f-display);font-size:1.12rem;align-items:center}
.pn.scene{flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pn.scene figcaption{font-family:var(--f-display);color:var(--ink2);text-align:center}
.viz{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;max-width:100%;overflow-x:auto}
.viz svg{max-width:100%;height:auto}
.wrong-eq{font-family:var(--f-display);font-size:1.8rem;color:var(--bad)}
.wrong-eq s{text-decoration-thickness:3px}

/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-family:var(--f-display);margin:0 .12em;font-weight:400}
.fr>span{padding:0 .18em}
.fr>span:first-child{border-bottom:.12em solid currentColor;padding-bottom:.06em}
.fr>span:last-child{padding-top:.06em}
.fr.big{font-size:3rem}
.mx{display:inline-flex;align-items:center;font-family:var(--f-display)}

/* pieces */
.pie .sl{stroke:var(--line);stroke-width:2.5;stroke-linejoin:round;fill:var(--slice);transition:fill .15s}
.pie.tap .sl{cursor:pointer}
.pie.tap .sl:hover{fill:var(--paper2)}
.sl.on,.pie.tap .sl.on:hover{fill:var(--castle)}
.sl.on2{fill:var(--sun)}
.sl.gone{fill:var(--paper2);stroke-dasharray:5 4;opacity:.6}
.apple{fill:var(--castle);stroke:var(--line);stroke-width:2}
.leaf{fill:var(--forest)}
.gems{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.gem{width:20px;height:20px}
.gem path{fill:var(--cave);stroke:var(--line);stroke-width:1.5}
.candies{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.grp{display:flex;flex-wrap:wrap;gap:4px;max-width:132px;padding:8px;border:2.5px dashed var(--ink2);border-radius:12px;background:transparent;justify-content:center}
button.grp{cursor:pointer}
.grp.sel{border-style:solid;border-color:var(--castle);background:var(--narr)}
.cdy{width:20px;height:20px;border-radius:50%;background:var(--cdy);border:2px solid var(--line);display:block}
.grp.sel .cdy{background:var(--castle)}

/* vertical multiplication */
.vm{font-family:var(--f-display);font-size:2.1rem;border-collapse:collapse;margin:0 auto}
.vm td{width:1.25em;height:1.35em;text-align:center;padding:0}
.vm tr.cr td{height:1em;font-size:1.1rem}
.vm tr.line td{border-top:3px solid var(--line)}
.carry{color:var(--castle)}
.hl{background:var(--narr);border-radius:6px;padding:0 .15em}

/* area model */
.area{display:grid;gap:4px;width:min(100%,420px);height:280px;margin:0 auto;font-family:var(--f-display)}
.area .lab{display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:1.05rem;padding:2px 6px}
.area .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2.5px solid var(--line);border-radius:6px;color:var(--onsun);font-size:.92rem;line-height:1.25;text-align:center;min-width:0}
.area .cell b{font-size:1.25rem;font-weight:400}
.c1{background:var(--sky)}.c2{background:var(--sun)}.c3{background:#B8EBCF}.c4{background:#FFC7B8}

/* lesson head */
.crumb{font-family:var(--f-display);color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap}
.crumb a{text-decoration:none;border-bottom:2px solid var(--sun)}
.lhead{background:var(--rc);color:var(--onrc);border:3px solid var(--line);box-shadow:6px 6px 0 var(--shadow);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:10px}
.lhead h1{font-size:clamp(1.7rem,5vw,2.4rem)}
.tag{align-self:flex-start;font-family:var(--f-display);background:var(--panel);color:var(--ink);border:2.5px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.9rem}
.tag.new{background:var(--sun);color:var(--onsun)}
.goal{background:rgba(0,0,0,.18);border-radius:10px;padding:8px 12px;max-width:44em}
.goal b{font-family:var(--f-display);font-weight:400;margin-right:6px}

/* widget */
.widget{background:var(--panel);border:3px solid var(--line);box-shadow:5px 5px 0 var(--shadow);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px;align-items:center;min-width:0}
.intro{color:var(--ink2);max-width:44em}
.stps{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.stp{display:flex;align-items:center;gap:6px;background:var(--paper2);border-radius:999px;padding:4px 6px 4px 14px;font-family:var(--f-display)}
.stp button{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--line);background:var(--panel);color:var(--ink);font-family:var(--f-display);font-size:1.3rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stp output{min-width:2ch;text-align:center;font-size:1.3rem;font-variant-numeric:tabular-nums}
.eq{font-family:var(--f-display);font-size:1.4rem;text-align:center;line-height:1.6}
.eq b{color:var(--castle);font-weight:400}
.note{color:var(--ink2);text-align:center;max-width:36em}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:52px}
.lbl{font-family:var(--f-display);color:var(--ink2)}
.baskets{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bk{width:96px;min-height:96px;border:3px solid var(--line);border-top-width:6px;border-radius:0 0 22px 22px;background:var(--paper2);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:6px;font-family:var(--f-display)}
.fam{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center}
.fam svg{width:220px;max-width:100%;height:auto}
.tnum{fill:var(--ink);font-family:var(--f-display);font-size:30px;text-anchor:middle}
.tnum.top{fill:var(--castle)}
.eqs{list-style:none;margin:0;padding:0;font-family:var(--f-display);font-size:1.35rem;display:grid;gap:4px}
.pie-row{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:center}
.frbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.read{font-family:var(--f-display);font-size:1.4rem}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.98rem}
.legend b{font-family:var(--f-display);font-weight:400;color:var(--castle);margin-right:6px}
.cmp{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.cmp-side{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.cmp-side svg{width:min(100%,300px);height:auto}
.sgn{font-family:var(--f-display);font-size:2.6rem;color:var(--castle);line-height:1}
.seg .btn{font-size:1rem}

/* quiz */
.qcard{background:var(--panel);border:3px solid var(--line);box-shadow:5px 5px 0 var(--shadow);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0;scroll-margin-top:80px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-display);color:var(--ink2)}
.pips{display:flex;gap:6px}
.pips i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--line);display:block}
.pips i.done{background:var(--forest)}
.pips i.now{background:var(--sun)}
.qtext{font-size:1.2rem;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.qtext .big{font-family:var(--f-display);font-size:2rem}
.qwho{display:flex;align-items:center;gap:8px;font-family:var(--f-hand);font-weight:700;font-size:1.25rem;background:var(--trickbg);border-radius:14px;padding:6px 12px 6px 6px;text-align:left}
.qwho .ch{width:54px;height:54px;flex:none}
.qans{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.ans{font-family:var(--f-display);font-size:1.7rem;width:4.2em;text-align:center;border:3px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:4px}
.ans.sm{width:2.6em}
.frin{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.frin hr{width:100%;border:0;border-top:3px solid var(--line);margin:0}
.qlab{font-family:var(--f-display);font-size:1.15rem}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opt{border:3px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 16px;font-family:var(--f-display);font-size:1.25rem;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);min-width:64px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.opt svg{display:block;max-width:100%;height:auto}
.opt.right{background:var(--forest);color:var(--onrc)}
.opt.wrong{background:var(--paper2);opacity:.5;text-decoration:line-through}
.fb{border-radius:12px;padding:0;font-size:1.08rem}
.fb:not(:empty){padding:12px 14px}
.fb b{font-family:var(--f-display);font-weight:400;margin-right:6px;font-size:1.15rem}
.fb.ok{background:var(--paper2);border:2.5px solid var(--ok)}
.fb.ok b{color:var(--ok)}
.fb.hint{background:var(--hintbg);border:2.5px solid var(--sun)}
.fb.bad{background:var(--paper2);border:2.5px solid var(--bad)}
.fb.bad b{color:var(--bad)}
.fb.warn{color:var(--bad)}
.result{align-items:center;text-align:center}
.result .stars{display:flex;gap:6px}
.result .stars svg{width:52px;height:52px}
.result h3{font-size:1.7rem}
.say{display:flex;gap:10px;align-items:center;text-align:left;max-width:36em}
.say .bub{margin:0}
.bigcrystal svg{width:120px;height:140px;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}

/* map */
.regions{display:grid;gap:26px}
.rg{background:var(--panel);border:3px solid var(--line);box-shadow:6px 6px 0 var(--shadow);border-radius:6px;overflow:hidden;position:relative}
.rg-h{background:var(--rc);color:var(--onrc);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--line)}
.rg-h h3{font-size:1.6rem}
.rg-h p{opacity:.95;font-size:.98rem}
.rg-h .crys svg{width:40px;height:48px}
.stops{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px;padding:16px}
.stop{text-align:left;display:flex;flex-direction:column;gap:4px;border:2.5px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 12px;text-decoration:none;color:var(--ink);transition:transform .1s}
.stop:hover{transform:translateY(-2px)}
.stop .no{font-family:var(--f-display);color:var(--ink2);font-size:.9rem}
.stop .tt{font-family:var(--f-display);font-size:1.12rem;line-height:1.3}
.stop .ss{display:flex;gap:2px}
.stop .ss svg{width:18px;height:18px}
.stop.boss{background:var(--narr)}
.path-dash{height:26px;margin:-26px auto;width:0;border-left:4px dashed var(--ink2)}

/* parents, certificate */
.parents{background:var(--panel);border:3px solid var(--line);border-radius:6px;padding:16px 20px}
.parents summary{font-family:var(--f-display);font-size:1.2rem;cursor:pointer}
.parents h4{font-family:var(--f-display);font-weight:400;font-size:1.08rem;margin:18px 0 6px}
.parents ul{margin:0;padding-left:1.2em;display:grid;gap:4px;max-width:46em}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;min-width:520px;font-size:.95rem}
.tbl th,.tbl td{border:1.5px solid var(--ink2);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{font-family:var(--f-display);font-weight:400;background:var(--paper2)}
.cert{background:var(--panel);border:5px double var(--line);border-radius:6px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.cert h2{font-size:2rem;color:var(--castle)}
.cert input{font-family:var(--f-display);font-size:1.4rem;text-align:center;border:0;border-bottom:3px solid var(--line);background:transparent;color:var(--ink);width:min(100%,12em)}
.cert p{max-width:32em}

.lnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.burst{position:fixed;pointer-events:none;z-index:50}
.burst i{position:absolute;width:16px;height:16px;background:var(--sun);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fr=(n,d,cls='')=>`<span class="fr ${cls}"><span>${n}</span><span>${d}</span></span>`;
const mixed=(w,n,d)=>`<span class="mx">${w}${fr(n,d)}</span>`;
const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- progress (this browser only) ---------- */
const PKEY='math3-adventure-v1';
const blank=()=>({stars:{},crystals:{},name:''});
let P=(()=>{try{return Object.assign(blank(),JSON.parse(localStorage.getItem(PKEY)||'{}'));}catch(e){return blank();}})();
/* Server sync: only when served by the 오늘우리집 server (/learn/), which answers api/progress for a signed-in member. */
const SYNC={on:false,name:'',timer:null,reset:false};
function pushProgress(){
  if(!SYNC.on)return;
  clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(()=>{
    const body=JSON.stringify({progress:P,reset:SYNC.reset});SYNC.reset=false;
    fetch('api/progress',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body,keepalive:true}).catch(()=>{});
  },600);
}
const save=()=>{try{localStorage.setItem(PKEY,JSON.stringify(P));}catch(e){}pushProgress();};
async function syncInit(){
  if(!/^https?:$/.test(location.protocol)||!/\/learn\/?$/.test(location.pathname))return;
  try{
    const r=await fetch('api/progress',{credentials:'same-origin',headers:{Accept:'application/json'}});
    if(!r.ok||!(r.headers.get('content-type')||'').includes('json'))return;
    const j=await r.json();
    SYNC.on=true;SYNC.name=String(j.name||'').slice(0,20);
    const sp=j.progress||{};
    for(const [k,v] of Object.entries(sp.stars||{}))P.stars[k]=Math.max(P.stars[k]||0,Number(v)||0);
    for(const [k,v] of Object.entries(sp.crystals||{}))if(v)P.crystals[k]=true;
    if(!P.name&&sp.name)P.name=String(sp.name);
    save();
    updateHeader();
    if(!location.hash||location.hash==='#home')renderHome();
  }catch(e){}
}

/* ---------- characters ---------- */
const NAMES={haru:'하루',semi:'셈이',ttung:'뚱땅'};
function face(who,f='happy'){
  const S='stroke="var(--line)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
  const F='stroke="var(--feat)" stroke-width="3" stroke-linecap="round" fill="none"';
  if(who==='haru'){
    const eyes=f==='happy'?`<path d="M35 58 Q40 52 45 58 M55 58 Q60 52 65 58" ${F}/>`:f==='think'?`<circle cx="42" cy="54" r="3.6" fill="var(--feat)"/><circle cx="62" cy="54" r="3.6" fill="var(--feat)"/>`:f==='oops'?`<path d="M35 54 L45 58 M65 54 L55 58" ${F}/>`:`<circle cx="40" cy="57" r="4.2" fill="var(--feat)"/><circle cx="60" cy="57" r="4.2" fill="var(--feat)"/>`;
    const mouth={happy:`<path d="M41 68 Q50 78 59 68" ${F}/>`,wow:`<ellipse cx="50" cy="71" rx="4.5" ry="6" fill="var(--feat)"/>`,think:`<path d="M44 71 Q50 69 57 72" ${F}/>`,oops:`<path d="M42 74 Q50 67 58 74" ${F}/>`}[f];
    return `<svg class="ch" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="58" r="30" fill="var(--skin)" ${S}/><path d="M19 56 Q16 22 50 21 Q84 22 81 56 Q76 40 64 37 Q58 46 46 40 Q30 39 19 56Z" fill="var(--hair)" ${S}/><path d="M64 37 Q70 30 78 33" fill="none" ${S}/>${eyes}<circle cx="32" cy="66" r="4.5" fill="var(--cheek)" opacity=".75"/><circle cx="68" cy="66" r="4.5" fill="var(--cheek)" opacity=".75"/>${mouth}</svg>`;
  }
  if(who==='semi'){
    const E='stroke="var(--sky)" stroke-width="3.5" stroke-linecap="round" fill="none"';
    const eyes={happy:`<path d="M36 57 Q41 50 46 57 M54 57 Q59 50 64 57" ${E}/>`,think:`<path d="M36 54 L46 54" ${E}/><rect x="54" y="49" width="10" height="10" rx="3" fill="var(--sky)"/>`,wow:`<circle cx="41" cy="54" r="5" ${E}/><circle cx="59" cy="54" r="5" ${E}/>`,oops:`<path d="M37 50 L45 58 M45 50 L37 58 M55 50 L63 58 M63 50 L55 58" ${E}/>`}[f];
    const mouth=(f==='wow'||f==='oops')?`<rect x="46" y="62" width="8" height="5" rx="2" fill="var(--sky)"/>`:`<path d="M43 63 Q50 68 57 63" ${E}/>`;
    return `<svg class="ch" viewBox="0 0 100 100" aria-hidden="true"><line x1="50" y1="30" x2="50" y2="16" ${S}/><circle cx="50" cy="13" r="6" fill="var(--sun)" ${S}/><rect x="11" y="46" width="11" height="18" rx="4" fill="var(--robot)" ${S}/><rect x="78" y="46" width="11" height="18" rx="4" fill="var(--robot)" ${S}/><rect x="20" y="30" width="60" height="52" rx="16" fill="var(--robot)" ${S}/><rect x="28" y="39" width="44" height="33" rx="9" fill="var(--screen)"/>${eyes}${mouth}<circle cx="34" cy="78" r="2" fill="var(--feat)"/><circle cx="66" cy="78" r="2" fill="var(--feat)"/></svg>`;
  }
  const eyes={happy:`<path d="M33 54 Q39 48 45 54 M55 54 Q61 48 67 54" ${F}/>`,think:`<path d="M33 51 L45 54 M55 54 L67 51" ${F}/><circle cx="41" cy="56" r="2.5" fill="var(--feat)"/><circle cx="63" cy="56" r="2.5" fill="var(--feat)"/>`,wow:`<circle cx="39" cy="54" r="4.5" fill="var(--feat)"/><circle cx="61" cy="54" r="4.5" fill="var(--feat)"/>`,oops:`<path d="M33 50 L45 55 M67 50 L55 55" ${F}/><circle cx="40" cy="57" r="2.5" fill="var(--feat)"/><circle cx="60" cy="57" r="2.5" fill="var(--feat)"/>`}[f];
  const mouth={happy:`<path d="M39 68 Q50 80 61 68Z" fill="var(--feat)"/>`,think:`<path d="M42 71 Q52 73 60 67" ${F}/>`,wow:`<ellipse cx="50" cy="72" rx="4" ry="5" fill="var(--feat)"/>`,oops:`<path d="M40 72 Q45 68 50 72 Q55 76 60 72" ${F}/>`}[f];
  return `<svg class="ch" viewBox="0 0 100 100" aria-hidden="true"><path d="M21 48 L25 11 L46 32Z" fill="var(--trick)" ${S}/><path d="M79 48 L75 11 L54 32Z" fill="var(--trick)" ${S}/><path d="M27 25 L28.5 17 L37 28Z" fill="var(--cheek)"/><path d="M73 25 L71.5 17 L63 28Z" fill="var(--cheek)"/><ellipse cx="50" cy="57" rx="32" ry="28" fill="var(--trick)" ${S}/><ellipse cx="50" cy="69" rx="17" ry="12" fill="var(--muzzle)"/>${eyes}<ellipse cx="50" cy="63" rx="4" ry="3" fill="var(--feat)"/>${mouth}</svg>`;
}
const H=(f,t)=>({w:'haru',f,t}), S=(f,t)=>({w:'semi',f,t}), T=(f,t)=>({w:'ttung',f,t});
const N=t=>({narr:t}), SC=(scene,cap)=>({scene,cap});

/* ---------- pictures ---------- */
function pie(d,on,o={}){
  const s=o.size||120,c=s/2,r=c-4,tot=o.angles?o.angles.reduce((a,b)=>a+b,0):d;
  const cls=i=>Array.isArray(on)?(on[i]||''):(i<on?'on':'');
  const act=o.click?'data-act="slice"':'';
  let p='';
  if(d===1)p=`<circle ${act} data-i="0" class="sl ${cls(0)}" cx="${c}" cy="${c}" r="${r}"/>`;
  else{let acc=0;for(let i=0;i<d;i++){const w=o.angles?o.angles[i]:1,a0=acc/tot*2*Math.PI-Math.PI/2;acc+=w;const a1=acc/tot*2*Math.PI-Math.PI/2;
    const x0=(c+r*Math.cos(a0)).toFixed(2),y0=(c+r*Math.sin(a0)).toFixed(2),x1=(c+r*Math.cos(a1)).toFixed(2),y1=(c+r*Math.sin(a1)).toFixed(2);
    p+=`<path ${act} data-i="${i}" class="sl ${cls(i)}" d="M${c} ${c} L${x0} ${y0} A${r} ${r} 0 ${(a1-a0)>Math.PI?1:0} 1 ${x1} ${y1}Z"/>`;}}
  const cnt=Array.isArray(on)?on.filter(x=>x==='on'||x==='on2').length:on;
  const lab=o.label||(o.angles?`크기가 서로 다른 ${d}조각으로 자른 원`:`똑같이 ${d}조각으로 나눈 원, ${cnt}조각 색칠`);
  return `<svg class="pie${o.click?' tap':''}" viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" role="img" aria-label="${lab}">${p}</svg>`;
}
function bar(d,on,o={}){
  const W=o.w||240,h=o.h||40,ws=o.widths||Array(d).fill(1),tot=ws.reduce((a,b)=>a+b,0);
  let x=3,p='';
  ws.forEach((w,i)=>{const ww=(W-6)*w/tot;p+=`<rect class="sl ${i<on?'on':''}" x="${x.toFixed(2)}" y="3" width="${ww.toFixed(2)}" height="${h-6}"/>`;x+=ww;});
  return `<svg class="pie" viewBox="0 0 ${W} ${h}" width="${W}" height="${h}" role="img" aria-label="${o.widths?`크기가 서로 다른 ${d}칸 막대`:`똑같이 ${d}칸으로 나눈 막대, ${on}칸 색칠`}">${p}</svg>`;
}
const pies=(n,d,size=96)=>{let h='',k=Math.max(1,Math.ceil(n/d));for(let i=0;i<k;i++)h+=pie(d,Math.min(d,n-i*d),{size});return `<div class="viz">${h}</div>`;};
function apples(c,r){
  const g=34;let p='';
  for(let y=0;y<r;y++)for(let x=0;x<c;x++){const cx=x*g+g/2,cy=y*g+g/2+3;p+=`<circle class="apple" cx="${cx}" cy="${cy}" r="12"/><ellipse class="leaf" cx="${cx+4}" cy="${cy-13}" rx="5" ry="2.6" transform="rotate(-30 ${cx+4} ${cy-13})"/>`;}
  return `<svg viewBox="0 0 ${c*g} ${r*g+4}" width="${c*g}" height="${r*g+4}" role="img" aria-label="사과 ${c}개씩 ${r}줄">${p}</svg>`;
}
const GEM='<svg class="gem" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5 L18.5 8 L10 18.5 L1.5 8Z"/></svg>';
const gemsHtml=n=>`<div class="gems" role="img" aria-label="보석 ${n}개">${GEM.repeat(n)}</div>`;
function candies(t,g,sel=[],tap=false){
  const s=t/g;let h=`<div class="candies" role="group" aria-label="사탕 ${t}개${g>1?`, ${s}개씩 ${g}묶음${sel.length?`, 색칠한 묶음 ${sel.length}개`:''}`:''}">`;
  for(let i=0;i<g;i++){const tag=tap?'button':'div';h+=`<${tag} ${tap?`type="button" data-act="grp" data-i="${i}" aria-pressed="${sel.includes(i)}" aria-label="${i+1}번째 묶음"`:''} class="grp ${sel.includes(i)?'sel':''}">${'<i class="cdy"></i>'.repeat(s)}</${tag}>`;}
  return h+'</div>';
}
function vmul(a,m,step){
  const o=a%10,X=o*m,c=Math.floor(X/10),A=String(a).padStart(3,' ').split(''),R=String(a*m).padStart(3,' ').split('');
  const row=(cells,cls='')=>`<tr class="${cls}">${cells.map(x=>`<td>${x===' '?'':x}</td>`).join('')}</tr>`;
  const carry=step>=1&&c?['','',`<span class="carry">${c}</span>`,'']:['','','',''];
  let rr=[' ',' ',' ',' '];
  if(step===1)rr=[' ',' ',' ',`<span class="hl">${X%10}</span>`];

const mlq=(q,labels,a,hint,ex,show)=>({type:'multi',q,labels,a,hint,ex,show:show||a.map((x,i)=>x+(labels[i]||'')).join(' ')});
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const red=(n,d)=>{const g=gcd(n,d);return [n/g,d/g];};
function mc(q,correct,wrongs,hint,ex,fixed){
  const ws=[...new Set(wrongs)].filter(w=>w!==correct);
  const opts=fixed?fixed:shuffle([correct,...ws]);
  return {type:'choice',q,opts,a:opts.indexOf(correct),hint,ex,show:correct};
}

{id:'div-3',r:'div',t:'나머지와 검산',goal:'나머지가 있는 나눗셈을 하고, 곱셈으로 맞는지 확인(검산)해요.',

{id:'river-2',r:'river',t:'받아올림이 있는 덧셈',goal:'받아올림이 있는 (두 자리 수)+(두 자리 수)를 세로셈으로 계산해요.',

{id:'river-3',r:'river',t:'받아내림이 있는 뺄셈',goal:'받아내림이 있는 (두 자리 수)−(두 자리 수)를 세로셈으로 계산해요.',

{id:'port-1',r:'port',t:'만, 억, 조: 큰 수 읽기',goal:'네 자리씩 끊어 만, 억, 조 단위의 수를 읽고 자릿값을 알아요.',

  const a=()=>{const s=big(),ok=koreanNum(s);const w1=koreanNum(s+'0'),w2=koreanNum(s.slice(0,-1)||'1'),w3=koreanNum(s.length>1?s.slice(1,2)+s.slice(0,1)+s.slice(2):s+'1');return mc(`<div class="viz">${placeChart(s)}</div><p class="big" style="font-size:1.5rem">${s}</p><p>바르게 읽은 것은?</p>`,ok,[w1,w2,w3],'오른쪽부터 네 자리씩 끊고, 왼쪽 덩어리부터 조·억·만을 붙여 읽어.',`${s}는 "${ok}"라고 읽어요.`);};

{id:'port-2',r:'port',t:'(세 자리)×(두 자리)',goal:'(세 자리 수)×(두 자리 수)를 나누어 곱한 뒤 더해서 계산해요.',

 widget:'partial',
 quiz:()=>{

{id:'port-3',r:'port',t:'(세 자리)÷(두 자리)',goal:'(세 자리 수)÷(두 자리 수)의 몫과 나머지를 어림해서 구하고 검산해요.',
 comic:[N('항구에서 사과 350개를 한 상자에 24개씩 담아요.'),
  H('think','24 × 10 = 240, 24 × 20 = 480. 그럼 몫은 10과 20 사이야.'),
  S('happy','어림하면 쉬워. 24 × 14 = 336, 24 × 15 = 360은 너무 커. 그래서 몫은 14, 나머지는 350 − 336 = 14야.'),
  T('happy','나머지가 24보다 크면 어때?'),
  H('oops','그럼 한 상자 더 담을 수 있잖아! 나머지는 나누는 수보다 작아야 해.'),
  SC('<p class="eq">24 × 14 + 14 = <b>350</b></p>','검산')],
 widget:'estdiv',
 quiz:()=>{
  const gen=()=>{let d,q,r,n;do{d=ri(12,49);q=ri(3,30);r=ri(0,d-1);n=d*q+r;}while(n<100||n>999);return {d,q,r,n};};
  const ex=o=>`${o.d} × ${o.q} = ${o.d*o.q}, ${o.n} − ${o.d*o.q} = ${o.r}. 검산: ${o.d} × ${o.q} + ${o.r} = ${o.n}`;
  const a=()=>{let o=gen();while(!o.r)o=gen();return qrq(`<p class="big">${o.n} ÷ ${o.d} = □ … □</p>`,o.q,o.r,`${o.d} × 10 = ${o.d*10}부터 어림해 봐.`,ex(o));};
  const b=()=>{const o=gen();return num(`<p class="big">${o.d*o.q} ÷ ${o.d} = □</p>`,o.q,`${o.d}에 몇을 곱하면 ${o.d*o.q}이(가) 될까?`,`${o.d} × ${o.q} = ${o.d*o.q}`);};
  const c=()=>{let o=gen();while(!o.r)o=gen();return num(`<p>어떤 수를 <b>${o.d}</b>(으)로 나누었더니 몫이 <b>${o.q}</b>, 나머지가 <b>${o.r}</b>였어요. 어떤 수는?</p>`,o.n,'나누는 수 × 몫 + 나머지 = 나누어지는 수',`${o.d} × ${o.q} + ${o.r} = ${o.n}`);};
  const d=()=>{let o=gen();while(!o.r)o=gen();return qrq(`<p>사과 <b>${o.n}개</b>를 한 상자에 <b>${o.d}개</b>씩 담으면 몇 상자가 되고, 몇 개가 남을까요?</p>`,o.q,o.r,'남는 사과는 한 상자에 담는 수보다 적어야 해.',ex(o));};
  return [a(),b(),c(),a(),d()];}},

{id:'light-1',r:'light',t:'분모가 같은 분수의 덧셈과 뺄셈',goal:'분모가 같은 진분수, 대분수의 덧셈과 뺄셈을 하고 결과를 대분수로 나타내요.',

{id:'light-3',r:'light',t:'소수의 덧셈과 뺄셈',goal:'소수점을 맞추어 소수의 덧셈과 뺄셈을 해요.',
 comic:[N('등대 매점에서 우유 0.75 L와 주스 0.5 L를 샀어요.'),

{id:'jungle-1',r:'jungle',t:'혼합 계산의 순서',goal:'덧셈, 뺄셈, 곱셈, 나눗셈, 괄호가 섞인 식을 계산 순서에 맞게 계산해요.',

{id:'jungle-2',r:'jungle',t:'약수와 배수',goal:'약수와 배수를 알고, 최대공약수와 최소공배수를 구해요.',
 comic:[N('밀림의 원숭이들이 바나나 12개를 똑같이 나누려고 해요.'),
  H('think','1명, 2명, 3명, 4명, 6명, 12명이면 남김없이 나눌 수 있어!'),
  S('happy','12를 나누어떨어지게 하는 수 1, 2, 3, 4, 6, 12를 12의 약수라고 해.'),
  SC(factorRects(12),'12 = 1×12 = 2×6 = 3×4'),
  T('happy','그럼 3, 6, 9, 12…는 3의 약수지?'),
  S('oops','그건 3의 배수야! 3을 1배, 2배, 3배 한 수지. 12와 18의 공약수 중 가장 큰 6이 최대공약수야.')],
 widget:'factors',
 quiz:()=>{
  const a=()=>{const n=pick([12,16,18,20,24,28,30,36]);return num(`<p><b>${n}</b>의 약수는 모두 몇 개일까요?</p>`,factorsOf(n).length,`1부터 차례로 ${n}을(를) 나누어떨어지게 하는 수를 찾아봐. 짝을 지으면 빠뜨리지 않아.`,`${n}의 약수: ${factorsOf(n).join(', ')}`);};
  const b=()=>{const n=pick([18,20,24,30,36]),fs=factorsOf(n),bad=pick([7,8,9,11,14,16].filter(x=>n%x!==0));return mc(`<p><b>${n}</b>의 약수가 <b>아닌</b> 것은?</p>`,String(bad),shuffle(fs.filter(x=>x>1&&x<n)).slice(0,3).map(String),`${n}을(를) 나누어 봐. 나누어떨어지지 않는 수를 찾아.`,`${n} ÷ ${bad}는 나누어떨어지지 않아요.`);};
  const c=()=>{const g=ri(2,9),x=g*ri(2,5);let y=g*ri(2,6);while(y===x)y=g*ri(2,6);const G=gcd(x,y);return num(`<p><b>${x}</b>과(와) <b>${y}</b>의 최대공약수는?</p>`,G,'두 수의 약수를 각각 써 보고, 공통인 약수 중 가장 큰 수를 찾아.',`공약수: ${factorsOf(G).join(', ')} → 최대공약수 ${G}`);};
  const d=()=>{const x=ri(3,9);let y=ri(4,12);while(y===x)y=ri(4,12);const L=lcm(x,y);return num(`<p><b>${x}</b>과(와) <b>${y}</b>의 최소공배수는?</p>`,L,`${Math.max(x,y)}의 배수를 차례로 쓰면서 ${Math.min(x,y)}로도 나누어떨어지는 첫 수를 찾아.`,`${x}과(와) ${y}의 공배수 중 가장 작은 수는 ${L}`);};
  const e=()=>{const x=ri(3,12),k=ri(4,9);return num(`<p><b>${x}</b>의 배수를 작은 수부터 쓸 때, <b>${k}번째</b> 수는?</p>`,x*k,`${x}에 1, 2, 3…을 곱한 수가 ${x}의 배수야.`,`${x} × ${k} = ${x*k}`);};
  return [a(),b(),c(),d(),e()];}},
{id:'jungle-3',r:'jungle',t:'약분과 통분',goal:'크기가 같은 분수를 만들고, 약분과 통분으로 분수의 크기를 비교해요.',
 comic:[N(`밀림 과일 가게. 수박을 ${fr(2,4)}통만큼과 ${fr(1,2)}통만큼 샀어요.`),

  const a=()=>{let n,d;do{d=ri(3,9);n=ri(1,d-1);}while(gcd(n,d)!==1);const k=ri(2,5);return frq(`<p class="big">${fr(n*k,d*k)}</p><p>기약분수로 나타내세요.</p>`,n,d,`분모와 분자를 둘의 최대공약수 ${k}(으)로 나눠 봐.`,`${fr(n*k,d*k)} = ${fr(n,d)} (분모와 분자를 ${k}로 나눔)`);};
  const b=()=>{const d=ri(2,8),n=ri(1,d-1),k=ri(2,5);return num(`<p class="big">${fr(n,d)} = ${fr('□',d*k)}</p>`,n*k,`분모에 ${k}을(를) 곱했으니 분자에도 ${k}을(를) 곱해.`,`${fr(n,d)} = ${fr(n*k,d*k)}`);};

{id:'volcano-1',r:'volcano',t:'분모가 다른 분수의 덧셈과 뺄셈',goal:'통분해서 분모가 다른 분수를 더하고 빼요.',
 comic:[N(`분수 화산 아래 온천. 물통에 물을 ${fr(1,2)}통 붓고 ${fr(1,3)}통 더 부었어요.`),

 widget:'unlike',
 quiz:()=>{

  const b=()=>{const [n1,d1,n2,d2]=pick2(false),L=lcm(d1,d2),s=n1*L/d1-n2*L/d2,[rn,rd]=red(s,L);return frq(`<p class="big">${fr(n1,d1)} − ${fr(n2,d2)} = □</p><p>기약분수로 나타내세요.</p>`,rn,rd,`먼저 ${L}(으)로 통분해.`,`${fr(n1*L/d1,L)} − ${fr(n2*L/d2,L)} = ${fr(s,L)}${rd!==L?` = ${fr(rn,rd)}`:''}`);};
  const c=()=>{const [n1,d1,n2,d2]=pick2(true),L=lcm(d1,d2),s=n1*L/d1+n2*L/d2,[rn,rd]=red(s,L);return frq(`${ttungSays(`${fr(n1,d1)} + ${fr(n2,d2)} = ${fr(n1+n2,d1+d2)}! 분자끼리, 분모끼리!`)}<p>바르게 계산해서 기약분수로 나타내면?</p>`,rn,rd,'분모가 다르면 먼저 통분해야 해.',`${fr(n1*L/d1,L)} + ${fr(n2*L/d2,L)} = ${fr(rn,rd)}`);};
  return [a(),b(),c(),a(),b()];}},
{id:'volcano-2',r:'volcano',t:'분수의 곱셈',goal:'(분수)×(자연수), (분수)×(분수)를 계산하고 약분해요.',
 comic:[N(`화산 쿠키 공장. 쿠키 반죽이 한 판에 ${fr(3,4)} kg씩, 2판 필요해요.`),

{id:'canyon-1',r:'canyon',t:'분수의 나눗셈',goal:'(분수)÷(자연수), (분수)÷(분수)를 계산해요.',

{id:'observ-3',r:'observ',t:'직육면체의 겉넓이와 부피',goal:'직육면체와 정육면체의 겉넓이와 부피를 구해요.',

    ()=>{const a=ri(2,9),b=ri(2,9),c=ri(2,9);return {steps:[`(${a} + ${b}) × ${c}`,`${a+b} × ${c}`,`${(a+b)*c}`],ans:(a+b)*c,hint:'괄호 안을 먼저 계산해.'};},
    ()=>{const c=ri(2,9),q=ri(2,9),b=c*q,a=ri(q+1,40);return {steps:[`${a} − ${b} ÷ ${c}`,`${a} − ${q}`,`${a-q}`],ans:a-q,hint:'나눗셈을 먼저 계산해.'};},
    ()=>{const a=ri(3,9),b=ri(3,9),c=ri(2,5),d=ri(2,5);if(a*b<=c*d)return {steps:[`${c} × ${d} + ${a} × ${b}`,`${c*d} + ${a*b}`,`${c*d+a*b}`],ans:c*d+a*b,hint:'곱셈 두 개를 먼저 계산해.'};return {steps:[`${a} × ${b} − ${c} × ${d}`,`${a*b} − ${c*d}`,`${a*b-c*d}`],ans:a*b-c*d,hint:'곱셈 두 개를 먼저 계산해.'};},
    ()=>{const c=ri(2,6),q=ri(2,8),b=ri(1,15),a=b+c*q,d=ri(1,20);return {steps:[`(${a} − ${b}) ÷ ${c} + ${d}`,`${a-b} ÷ ${c} + ${d}`,`${q} + ${d}`,`${q+d}`],ans:q+d,hint:'괄호 → 나눗셈 → 덧셈 순서야.'};}
  ];
  return pick(T)();
}

/* ---------- interactive widgets ---------- */
const stp=(k,label,v)=>`<div class="stp"><span>${label}</span><button type="button" data-k="${k}" data-d="-1" aria-label="${label} 줄이기">−</button><output aria-live="polite">${v}</output><button type="button" data-k="${k}" data-d="1" aria-label="${label} 늘리기">+</button></div>`;
const divs=t=>{const r=[];for(let g=2;g<t;g++)if(t%g===0)r.push(g);return r;};
const TOT=[6,8,10,12,15,16,18,20,24];
const shareView=s=>{const r=s.r,pile=s.t-r*s.n,done=pile<s.n;
  return `<div class="stps">${stp('t','보석',s.t)}${stp('n','바구니',s.n)}</div>
  <div class="pile"><span class="lbl">남은 보석 ${pile}개</span>${gemsHtml(pile)}</div>
  <div class="baskets">${Array.from({length:s.n},()=>`<div class="bk">${gemsHtml(r)}<span>${r}개</span></div>`).join('')}</div>

  <p class="eq">${done?`${s.t} ÷ ${s.n} = <b>${r}</b>${pile?` … 나머지 <b>${pile}</b>`:''}`:'바구니마다 하나씩 차례로 나눠 줘 볼까?'}</p>
  ${done?`<p class="note">${pile?`남은 ${pile}개는 바구니 ${s.n}개에 하나씩 줄 수 없어서 나머지가 돼요. (검산: ${s.n} × ${r} + ${pile} = ${s.t})`:`딱 맞게 나누어졌어요. (${s.n} × ${r} = ${s.t})`}</p>`:''}`;};
const shareStep=(k,d,s)=>{if(k==='t')s.t=clamp(s.t+d,2,30);else s.n=clamp(s.n+d,2,6);s.r=0;};
const shareAct=(a,el,s)=>{if(a==='deal'&&s.t-s.r*s.n>=s.n)s.r++;if(a==='all')s.r=Math.floor(s.t/s.n);if(a==='reset')s.r=0;};

  share:{intro:'보석 수와 바구니 수를 정하고, 바구니마다 하나씩 나눠 줘 보세요. 한 바구니에 몇 개씩 들어갈까요?',init:()=>({t:12,n:3,r:0}),view:shareView,step:shareStep,act:shareAct},

  fair:{intro:'두 가지 칼질을 비교해 보세요. 조각 수를 바꿔도 셈이의 칼질은 언제나 똑같은 크기예요.',
    init:()=>({d:4,mode:'bad',w:unequalW(4)}),
    view:s=>`<div class="row seg"><button type="button" class="btn ${s.mode==='bad'?'':'ghost'}" data-act="bad" aria-pressed="${s.mode==='bad'}">뚱땅이의 칼질</button><button type="button" class="btn ${s.mode==='good'?'':'ghost'}" data-act="good" aria-pressed="${s.mode==='good'}">셈이의 칼질</button></div><div class="stps">${stp('d','조각 수',s.d)}</div><div class="viz">${pie(s.d,0,{size:200,angles:s.mode==='bad'?s.w:null})}</div><p class="note">${s.mode==='bad'?`${s.d}조각이지만 크기가 제각각! 이렇게 자른 조각은 분수로 나타낼 수 없어요.`:`똑같이 ${s.d}조각! 한 조각은 전체의 ${fr(1,s.d)}이에요.`}</p>`,

  pie:{intro:'조각 수를 정하고, 피자 조각을 눌러 색칠해 보세요. 분수가 바로 바뀌어요.',
    init:()=>({d:4,on:[true,false,false,false]}),

    step:(k,d,s)=>{if(k==='d')s.d=clamp(s.d+d,2,10);else s[k]+=d;WIDGETS.addpie.fix(s);},

const mkTenframe=(max,intro)=>({intro,

  step:(k,d,s)=>{if(k==='a'){s.a=clamp(s.a+d,1,9);s.b=Math.min(s.b,max-s.a);}else s.b=clamp(s.b+d,1,max-s.a);}});
const mkCol=op=>({intro:op==='+'?'"다음 단계"를 눌러 받아올림이 있는 덧셈을 한 단계씩 풀어 보세요.':'"다음 단계"를 눌러 받아내림이 있는 뺄셈을 한 단계씩 풀어 보세요.',
  init:()=>{let a,b;if(op==='+'){do{a=ri(15,69);b=ri(12,29);}while((a%10)+(b%10)<10||a+b>=100);}else{do{a=ri(31,98);b=ri(12,a-10);}while((a%10)>=(b%10));}return {a,b,step:0};},
  view:s=>{const ao=s.a%10,bo=s.b%10,at=Math.floor(s.a/10),bt=Math.floor(s.b/10);

    return `${vcol(s.a,s.b,op,s.step)}${stepRow(s,2,msgs)}`;},
  act:(a,el,s)=>{if(a==='next')s.step=Math.min(2,s.step+1);if(a==='new')Object.assign(s,mkCol(op).init());}});
const PCT_BASES=[2,4,5,10,20,25,50,100];
Object.assign(WIDGETS,{
  blocks2:{intro:'10개씩 묶음과 낱개의 수를 바꿔 보세요. 수와 읽는 법이 함께 바뀌어요.',
    init:()=>({t:2,o:3}),
    view:s=>{const n=s.t*10+s.o;return `<div class="stps">${stp('t','10개씩 묶음',s.t)}${stp('o','낱개',s.o)}</div>${tensHtml(s.t,s.o)}<p class="eq">10개씩 묶음 ${s.t}개, 낱개 ${s.o}개 → <b>${n}</b></p>${n?`<p class="note">읽기: ${korean4(n)} / ${nativeNum(n)||korean4(n)}</p>`:''}`;},
    step:(k,d,s)=>{s[k]=clamp(s[k]+d,0,k==='t'?5:9);}},
  tenframe:mkTenframe(10,'노란 구슬과 빨간 구슬의 수를 바꿔 보세요. 두 수를 모으면 얼마가 되는지, 어떻게 가를 수 있는지 볼 수 있어요.'),
  tenframe20:mkTenframe(18,'두 수를 더해 10이 넘을 때, 먼저 10칸을 채우고 남은 수를 더하는 방법을 확인해 보세요.'),
  chart100:{intro:'수 배열표에서 수를 눌러 보세요. 1 큰 수, 1 작은 수, 10 큰 수, 10 작은 수가 표시돼요.',
    init:()=>({sel:74}),
    view:s=>{const nb=[s.sel-1,s.sel+1,s.sel-10,s.sel+10];return `<div class="chart100">${Array.from({length:100},(_,i)=>i+1).map(n=>`<button type="button" data-act="n" data-i="${n}" class="${n===s.sel?'sel':nb.includes(n)?'nb':''}" aria-pressed="${n===s.sel}">${n}</button>`).join('')}</div><p class="eq"><b>${s.sel}</b> (${korean4(s.sel)}${s.sel<100?`, ${nativeNum(s.sel)}`:''})</p><p class="note">1 작은 수 ${s.sel-1>0?s.sel-1:'-'}, 1 큰 수 ${s.sel<100?s.sel+1:'-'}, 10 작은 수 ${s.sel>10?s.sel-10:'-'}, 10 큰 수 ${s.sel<=90?s.sel+10:'-'}</p>`;},
    act:(a,el,s)=>{if(a==='n')s.sel=+el.dataset.i;}},
  clock30:{intro:'몇 시를 바꾸고 "30분" 버튼을 눌러 보세요. 짧은바늘과 긴바늘이 어떻게 움직이는지 살펴봐요.',
    init:()=>({h:3,half:false}),
    view:s=>`<div class="stps">${stp('h','몇 시',s.h)}</div><button type="button" class="btn ${s.half?'':'ghost'}" data-act="half" aria-pressed="${s.half}">${s.half?'30분 보는 중':'30분 보기'}</button><div class="viz">${clockSvg(s.h,s.half?30:0,200)}</div><p class="eq"><b>${s.h}시${s.half?' 30분':''}</b></p><p class="note">${s.half?`긴바늘이 6, 짧은바늘이 ${s.h}와(과) ${s.h%12+1} 사이에 있어요.`:`긴바늘이 12, 짧은바늘이 ${s.h}을(를) 가리켜요.`}</p>`,
    step:(k,d,s)=>{s.h=(s.h+d+11)%12+1;},act:(a,el,s)=>{if(a==='half')s.half=!s.half;}},
  clock5:{intro:'시와 분을 바꿔 보세요. 긴바늘이 숫자 한 칸 움직일 때마다 5분이에요.',
    init:()=>({h:2,m:25}),
    view:s=>`<div class="stps">${stp('h','시',s.h)}${stp('m','분',s.m)}</div><div class="viz">${clockSvg(s.h,s.m,200)}</div><p class="eq"><b>${s.h}시 ${s.m}분</b></p><p class="note">긴바늘이 ${s.m/5||12}을(를) 가리키면 ${s.m}분이에요. 긴바늘이 한 바퀴 돌면 60분 = 1시간!</p>`,
    step:(k,d,s)=>{if(k==='h')s.h=(s.h+d+11)%12+1;else{const t=s.m+d*5;if(t>=60){s.m=t-60;s.h=s.h%12+1;}else if(t<0){s.m=t+60;s.h=(s.h+10)%12+1;}else s.m=t;}}},
  blocks3:{intro:'백 모형, 십 모형, 일 모형의 수를 바꿔 보세요. 세 자리 수와 읽는 법이 바뀌어요.',
    init:()=>({h:3,t:4,o:2}),
    view:s=>{const n=s.h*100+s.t*10+s.o;return `<div class="stps">${stp('h','백',s.h)}${stp('t','십',s.t)}${stp('o','일',s.o)}</div><div class="viz">${blocksSvg(s.h,s.t,s.o)}</div><p class="eq"><b>${n}</b> (${koreanNum(n)})</p><p class="note">백의 자리 ${s.h} = ${s.h*100}, 십의 자리 ${s.t} = ${s.t*10}, 일의 자리 ${s.o} = ${s.o}</p>`;},
    step:(k,d,s)=>{s[k]=clamp(s[k]+d,k==='h'?1:0,9);}},
  coladd:mkCol('+'),
  colsub:mkCol('-'),
  gugutable:{intro:'곱셈표에서 단 이름을 눌러 보세요. 그 단이 몇씩 커지는지 확인할 수 있어요.',
    init:()=>({row:7}),
    view:s=>`<div class="gtab-wrap"><table class="gtab"><thead><tr><th>×</th>${[1,2,3,4,5,6,7,8,9].map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${[2,3,4,5,6,7,8,9].map(r=>`<tr class="${r===s.row?'on':''}"><th><button type="button" data-act="row" data-i="${r}" aria-pressed="${r===s.row}">${r}단</button></th>${[1,2,3,4,5,6,7,8,9].map(c=>`<td>${r*c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="eq">${s.row}단은 <b>${s.row}씩</b> 커져요</p><p class="note">${s.row} × 0 = 0, ${s.row} × 1 = ${s.row}. 0을 곱하면 0, 1을 곱하면 그대로예요.</p>`,
    act:(a,el,s)=>{if(a==='row')s.row=+el.dataset.i;}},
  bignum:{intro:'"×10"과 "÷10"을 눌러 수를 바꿔 보세요. 네 자리마다 만, 억, 조로 단위가 바뀌어요.',
    init:()=>({s:'35000000'}),
    view:s=>`${placeChart(s.s)}<p class="eq" style="font-size:1.2rem;overflow-wrap:anywhere">${s.s}</p><p class="eq"><b>${koreanNum(s.s)}</b></p><div class="row"><button type="button" class="btn ghost" data-act="mul" ${s.s.length>=16?'disabled':''}>×10</button><button type="button" class="btn ghost" data-act="div" ${s.s.length<=1?'disabled':''}>÷10</button><button type="button" class="btn ghost" data-act="new">새 수</button></div>`,
    act:(a,el,s)=>{if(a==='mul'&&s.s.length<16)s.s+='0';if(a==='div'&&s.s.length>1)s.s=s.s.slice(0,-1);if(a==='new'){const len=ri(6,13);let t=String(ri(1,9));for(let i=1;i<len;i++)t+=Math.random()<.4?'0':String(ri(1,9));s.s=t;}}},
  partial:{intro:'두 자리 수를 몇십과 몇으로 나눠 곱한 다음 더해요. "다음 단계"를 눌러 보세요.',
    init:()=>({a:ri(102,499),b:ri(12,39),step:0}),
    view:s=>{const o=s.b%10,t=s.b-o;const lines=[`${s.a} × ${s.b}`,`${s.a} × ${o} = ${s.a*o}`,`${s.a} × ${t} = ${s.a*t}`,`${s.a*o} + ${s.a*t} = ${s.a*s.b}`];return `<ol class="steps">${lines.slice(0,s.step+1).map((l,i)=>`<li class="${i===s.step?'now':''}">${l}</li>`).join('')}</ol>${stepRow(s,3,[`${s.b}를 ${t}과 ${o}(으)로 나눠요.`,'먼저 일의 자리 수를 곱해요.',`${t}은 ${t/10}의 10배라서 곱도 10배예요.`,'두 곱을 더하면 답!'])}`;},
    act:(a,el,s)=>{if(a==='next')s.step=Math.min(3,s.step+1);if(a==='new')Object.assign(s,{a:ri(102,499),b:ri(12,39),step:0});}},
  estdiv:{intro:'나누는 수에 몇을 곱해야 나누어지는 수에 가장 가까워지는지 어림해 보세요.',
    init:()=>{let d,q,r,n;do{d=ri(12,49);q=ri(3,30);r=ri(1,d-1);n=d*q+r;}while(n<100||n>999);return {d,q,r,n,step:0};},
    view:s=>{const lines=[`${s.n} ÷ ${s.d}`,`${s.d} × 10 = ${s.d*10}${s.q>=20?`, ${s.d} × 20 = ${s.d*20}`:''}`,`${s.d} × ${s.q} = ${s.d*s.q}, ${s.d} × ${s.q+1} = ${s.d*(s.q+1)} (너무 커요)`,`몫 ${s.q}, 나머지 ${s.n} − ${s.d*s.q} = ${s.r}`,`검산: ${s.d} × ${s.q} + ${s.r} = ${s.n}`];return `<ol class="steps">${lines.slice(0,s.step+1).map((l,i)=>`<li class="${i===s.step?'now':''}">${l}</li>`).join('')}</ol>${stepRow(s,4,['어림부터 해요.','몇십을 곱해서 범위를 좁혀요.','하나씩 늘려 가며 넘지 않는 가장 큰 수를 찾아요.','나머지는 나누는 수보다 작아야 해요.','나누는 수 × 몫 + 나머지 = 나누어지는 수'])}`;},
    act:(a,el,s)=>{if(a==='next')s.step=Math.min(4,s.step+1);if(a==='new')Object.assign(s,WIDGETS.estdiv.init());}},
  decgrid:{intro:'0.1과 0.01의 개수를 바꿔 보세요. 100칸 중 1칸이 0.01, 한 줄(10칸)이 0.1이에요.',
    init:()=>({t:2,h:5}),
    view:s=>{const k=s.t*10+s.h;return `<div class="stps">${stp('t','0.1의 개수',s.t)}${stp('h','0.01의 개수',s.h)}</div><div class="viz">${decGrid(s.t*10,s.h,200)}</div><p class="eq"><b>${k===100?'1':(k/100).toFixed(2)}</b></p><p class="note">0.1이 ${s.t}개, 0.01이 ${s.h}개예요. 소수 첫째 자리 ${s.t}, 소수 둘째 자리 ${s.h}.</p>`;},
    step:(k,d,s)=>{s[k]=clamp(s[k]+d,0,9);}},
  decalign:{intro:'소수점을 맞추면 빈 자리에 0이 있는 것처럼 계산할 수 있어요. 더하기와 빼기를 바꿔 보세요.',
    init:()=>{const x=ri(205,899),y=ri(11,19)*10;return {x,y,mode:'add'};},
    view:s=>{const add=s.mode==='add',r=add?s.x+s.y:s.x-s.y,f=n=>(n/100).toFixed(2).padStart(5,' ');const row=(sign,str,cls='',hl)=>`<tr class="${cls}"><td>${sign}</td>${str.split('').map((c,i)=>`<td>${c===' '?'':hl&&i===str.length-1?`<span class="hl">${c}</span>`:c}</td>`).join('')}</tr>`;return `<div class="row seg"><button type="button" class="btn ${add?'':'ghost'}" data-act="add" aria-pressed="${add}">더하기</button><button type="button" class="btn ${add?'ghost':''}" data-act="sub" aria-pressed="${!add}">빼기</button></div><table class="vm"><tbody>${row('',f(s.x))}${row(add?'+':'−',f(s.y),'',true)}${row('',f(r),'line')}</tbody></table><p class="eq">${decStr(s.x,2)} ${add?'+':'−'} ${decStr(s.y,2)} = <b>${decStr(r,2)}</b></p><p class="note">${decStr(s.y,2)}는 ${(s.y/100).toFixed(2)}와 같아요. 노란 0을 채우고 같은 자리끼리 계산해요.</p><button type="button" class="btn ghost" data-act="new">새 문제</button>`;},
    act:(a,el,s)=>{if(a==='add'||a==='sub')s.mode=a;if(a==='new')Object.assign(s,WIDGETS.decalign.init(),{mode:s.mode});}},
  order:{intro:'"다음 단계"를 눌러 계산 순서대로 식을 줄여 보세요.',
    init:()=>({e:mixedExpr(),step:0}),
    view:s=>`<ol class="steps">${s.e.steps.slice(0,s.step+1).map((l,i)=>`<li class="${i===s.step?'now':''}">${i?'= ':''}${l}</li>`).join('')}</ol>${stepRow(s,s.e.steps.length-1,s.e.steps.map((_,i)=>i===0?s.e.hint:i===s.e.steps.length-1?'계산 끝!':'다음으로 계산할 부분을 찾아요.'))}`,
    act:(a,el,s)=>{if(a==='next')s.step=Math.min(s.e.steps.length-1,s.step+1);if(a==='new')Object.assign(s,{e:mixedExpr(),step:0});}},
  factors:{intro:'수를 바꿔 보세요. 직사각형으로 늘어놓을 수 있는 방법이 곧 약수예요.',
    init:()=>({n:12}),
    view:s=>`<div class="stps">${stp('n','수',s.n)}</div>${factorRects(s.n)}<p class="eq">${s.n}의 약수 (${factorsOf(s.n).length}개)</p><div class="chips">${factorsOf(s.n).map(x=>`<span class="hl">${x}</span>`).join('')}</div><p class="eq">${s.n}의 배수</p><div class="chips">${[1,2,3,4,5,6,7,8].map(k=>`<span>${s.n*k}</span>`).join('')}</div>`,
    step:(k,d,s)=>{s.n=clamp(s.n+d,2,36);}},
  equiv:{intro:'분모와 분자에 같은 수를 곱해 보세요. 막대의 색칠한 길이가 그대로인지 확인해요.',
    init:()=>({n:1,d:2,k:2}),
    view:s=>`<div class="stps">${stp('n','분자',s.n)}${stp('d','분모',s.d)}${stp('k','곱하는 수',s.k)}</div><div class="cmp-side">${bar(s.d,s.n,{w:300,h:40})}${bar(s.d*s.k,s.n*s.k,{w:300,h:40})}</div><p class="eq">${fr(s.n,s.d)} = ${fr(s.n*s.k,s.d*s.k)}</p><p class="note">${fr(s.n*s.k,s.d*s.k)}의 분모와 분자를 ${s.k}(으)로 나누면 ${fr(s.n,s.d)} (약분)</p>`,
    step:(k,d,s)=>{if(k==='d'){s.d=clamp(s.d+d,2,6);s.n=Math.min(s.n,s.d-1);}else if(k==='n')s.n=clamp(s.n+d,1,s.d-1);else s.k=clamp(s.k+d,1,5);}},
  unlike:{intro:'두 분수의 분모를 바꿔 보세요. 최소공배수로 통분하면 같은 크기의 조각으로 더할 수 있어요.',
    init:()=>({n1:1,d1:2,n2:1,d2:3}),
    view:s=>{const L=lcm(s.d1,s.d2),a=s.n1*L/s.d1,b=s.n2*L/s.d2,t=a+b,[rn,rd]=red(t,L);const cls=Array.from({length:Math.max(L,t)},(_,i)=>i<a?'on':i<t?'on2':'');return `<div class="stps">${stp('n1','첫째 분자',s.n1)}${stp('d1','첫째 분모',s.d1)}${stp('n2','둘째 분자',s.n2)}${stp('d2','둘째 분모',s.d2)}</div>${t<=L?barCls(cls.slice(0,L)):pies(t,L,90)}<p class="eq">${fr(s.n1,s.d1)} + ${fr(s.n2,s.d2)} = ${fr(a,L)} + ${fr(b,L)} = <b>${fr(t,L)}</b>${rd!==L?` = ${fr(rn,rd)}`:''}</p><p class="note">${s.d1}과(와) ${s.d2}의 최소공배수 ${L}(으)로 통분했어요.</p>`;},
    step:(k,d,s)=>{if(k==='d1'||k==='d2'){s[k]=clamp(s[k]+d,2,9);s.n1=Math.min(s.n1,s.d1-1);s.n2=Math.min(s.n2,s.d2-1);}else s[k]=clamp(s[k]+d,1,(k==='n1'?s.d1:s.d2)-1);}},
  fracmul:{intro:'두 분수를 바꿔 보세요. 가로로 나눈 것과 세로로 나눈 것이 겹치는 부분이 곱이에요.',
    init:()=>({a:2,b:3,c:1,d:2}),
    view:s=>{const [rn,rd]=red(s.a*s.c,s.b*s.d);return `<div class="stps">${stp('a','첫째 분자',s.a)}${stp('b','첫째 분모',s.b)}${stp('c','둘째 분자',s.c)}${stp('d','둘째 분모',s.d)}</div><div class="viz">${fracMulGrid(s.a,s.b,s.c,s.d)}</div><p class="eq">${fr(s.a,s.b)} × ${fr(s.c,s.d)} = ${fr(s.a*s.c,s.b*s.d)}${rd!==s.b*s.d?` = <b>${fr(rn,rd)}</b>`:''}</p><p class="note">전체 ${s.b*s.d}칸 중 진하게 겹친 ${s.a*s.c}칸이에요.</p>`;},
    step:(k,d,s)=>{if(k==='b'||k==='d'){s[k]=clamp(s[k]+d,2,8);s.a=Math.min(s.a,s.b);s.c=Math.min(s.c,s.d);}else s[k]=clamp(s[k]+d,1,k==='a'?s.b:s.d);}},
  decmul:{intro:'소수를 자연수처럼 곱한 다음, 소수점 아래 자리 수만큼 소수점을 옮겨요.',
    init:()=>({x:6,y:4,mode:'nat'}),
    view:s=>{const nat=s.mode==='nat',P=s.x*s.y,pl=nat?1:2,xs=decStr(s.x,1),ys=nat?String(s.y):decStr(s.y,1);return `<div class="row seg"><button type="button" class="btn ${nat?'':'ghost'}" data-act="nat" aria-pressed="${nat}">소수 × 자연수</button><button type="button" class="btn ${nat?'ghost':''}" data-act="dec" aria-pressed="${!nat}">소수 × 소수</button></div><div class="stps">${stp('x','첫째 수(0.1 단위)',xs)}${stp('y',nat?'둘째 수':'둘째 수(0.1 단위)',ys)}</div><ol class="steps"><li>${xs} × ${ys}</li><li>자연수처럼: ${s.x} × ${s.y} = ${P}</li><li>소수점 아래 자리 수: ${nat?'1':'1 + 1 = 2'}</li><li class="now">답: ${decStr(P,pl)}</li></ol>`;},
    step:(k,d,s)=>{s[k]=clamp(s[k]+d,1,k==='x'?99:(s.mode==='nat'?9:99));},
    act:(a,el,s)=>{if(a==='nat'){s.mode='nat';s.y=clamp(s.y,1,9);}if(a==='dec')s.mode='dec';}},
  fitbar:{intro:'나누는 분수가 나누어지는 분수 안에 몇 번 들어가는지 색으로 묶어서 보여 줘요.',
    init:()=>({a:3,b:1,d:4}),
    view:s=>{const q=Math.floor(s.a/s.b),r=s.a%s.b,[rn,rd]=red(s.a,s.b);const cls=Array.from({length:s.d},(_,i)=>i<q*s.b?(Math.floor(i/s.b)%2?'on2':'on'):i<s.a?'gone':'');return `<div class="stps">${stp('d','분모',s.d)}${stp('a','나누어지는 수의 분자',s.a)}${stp('b','나누는 수의 분자',s.b)}</div>${barCls(cls)}<p class="eq">${fr(s.a,s.d)} ÷ ${fr(s.b,s.d)} = ${s.a} ÷ ${s.b} = <b>${rd===1?rn:fr(rn,rd)}</b></p><p class="note">${fr(s.b,s.d)}이(가) ${q}번 들어가${r?`고 ${fr(r,s.b)}만큼 더 들어가`:''}요. 분모가 같으면 분자끼리 나누면 돼요.</p>`;},
    step:(k,d,s)=>{if(k==='d'){s.d=clamp(s.d+d,2,10);s.a=Math.min(s.a,s.d);s.b=Math.min(s.b,s.a);}else if(k==='a'){s.a=clamp(s.a+d,1,s.d);s.b=Math.min(s.b,s.a);}else s.b=clamp(s.b+d,1,s.a);}},
  decdiv:{intro:'나누는 수가 소수이면, 두 수에 똑같이 10이나 100을 곱해서 자연수의 나눗셈으로 바꿔요.',
    init:()=>{const y=ri(2,9),q=ri(2,12);return {y,q,step:0};},
    view:s=>{const x=s.y*s.q,lines=[`${decStr(x,1)} ÷ 0.${s.y}`,`(${decStr(x,1)} × 10) ÷ (0.${s.y} × 10)`,`${x} ÷ ${s.y}`,`= ${s.q}`];return `<ol class="steps">${lines.slice(0,s.step+1).map((l,i)=>`<li class="${i===s.step?'now':''}">${l}</li>`).join('')}</ol>${stepRow(s,3,['나누는 수가 소수예요.','두 수에 똑같이 10을 곱해요. 몫은 그대로예요.','자연수의 나눗셈이 됐어요.','몫을 구했어요!'])}`;},
    act:(a,el,s)=>{if(a==='next')s.step=Math.min(3,s.step+1);if(a==='new')Object.assign(s,WIDGETS.decdiv.init());}},
  percent:{intro:'비교하는 양과 기준량을 바꿔 보세요. 비율이 분수, 소수, 백분율로 함께 바뀌어요.',
    init:()=>({k:2,bi:2}),
    view:s=>{const base=PCT_BASES[s.bi],p=s.k/base*100;return `<div class="stps">${stp('k','비교하는 양',s.k)}${stp('bi','기준량',base)}</div><div class="viz">${decGrid(Math.round(p),0,180)}</div><p class="eq">${s.k} : ${base} → ${fr(s.k,base)} = ${fmt(s.k/base)} = <b>${fmt(p)}%</b></p><p class="note">기준량을 100으로 봤을 때 비교하는 양이 얼마인지가 백분율이에요.</p>`;},
    step:(k,d,s)=>{if(k==='bi'){s.bi=clamp(s.bi+d,0,PCT_BASES.length-1);s.k=Math.min(s.k,PCT_BASES[s.bi]);}else s.k=clamp(s.k+d,0,PCT_BASES[s.bi]);}},
  proportion:{intro:'비의 두 수와 곱하는 수를 바꿔 보세요. 같은 비율의 비와 비례배분 결과를 볼 수 있어요.',
    init:()=>({a:2,b:3,k:4}),
    view:s=>{const t=(s.a+s.b)*s.k;return `<div class="stps">${stp('a','전항',s.a)}${stp('b','후항',s.b)}${stp('k','곱하는 수',s.k)}</div>${barCls(Array.from({length:s.a+s.b},(_,i)=>i<s.a?'on':'on2'))}<p class="eq">${s.a} : ${s.b} = <b>${s.a*s.k} : ${s.b*s.k}</b></p><p class="note">외항의 곱 ${s.a} × ${s.b*s.k} = ${s.a*s.b*s.k}, 내항의 곱 ${s.b} × ${s.a*s.k} = ${s.a*s.b*s.k}</p><p class="eq">${t}을(를) ${s.a} : ${s.b}로 나누면 → <b>${s.a*s.k}</b>과(와) <b>${s.b*s.k}</b></p>`;},
    step:(k,d,s)=>{s[k]=clamp(s[k]+d,1,k==='k'?6:9);}},
  circle:{intro:'반지름을 바꿔 보세요. 원주와 넓이가 원주율 3.14로 계산돼요.',
    init:()=>({r:5}),
    view:s=>`<div class="stps">${stp('r','반지름',s.r)}</div><div class="viz">${circleSvg(s.r)}</div><p class="eq">지름 ${s.r*2} · 원주 ${s.r*2} × 3.14 = <b>${fmt(s.r*2*3.14)}</b></p><p class="eq">넓이 ${s.r} × ${s.r} × 3.14 = <b>${fmt(s.r*s.r*3.14)}</b></p>`,
    step:(k,d,s)=>{s.r=clamp(s.r+d,1,20);}},
  cuboid:{intro:'가로, 세로, 높이를 바꿔 보세요. 쌓기나무 수가 곧 부피예요.',
    init:()=>({a:4,b:3,c:2}),
    view:s=>`<div class="stps">${stp('a','가로',s.a)}${stp('b','세로',s.b)}${stp('c','높이',s.c)}</div><div class="viz">${cuboid(s.a,s.b,s.c)}</div><p class="eq">부피 ${s.a} × ${s.b} × ${s.c} = <b>${s.a*s.b*s.c}</b></p><p class="eq">겉넓이 (${s.a*s.b} + ${s.b*s.c} + ${s.a*s.c}) × 2 = <b>${2*(s.a*s.b+s.b*s.c+s.a*s.c)}</b></p>`,
    step:(k,d,s)=>{s[k]=clamp(s[k]+d,1,6);}}
});

function mountWidget(root,spec){
  const st=spec.init();
  const render=focusSel=>{root.innerHTML=spec.view(st);if(focusSel){const el=root.querySelector(focusSel);if(el&&!el.disabled)el.focus({preventScroll:true});}};
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-k]');
    if(b&&root.contains(b)){spec.step(b.dataset.k,+b.dataset.d,st);render(`[data-k="${b.dataset.k}"][data-d="${b.dataset.d}"]`);return;}
    const t=e.target.closest('[data-act]');
    if(t&&root.contains(t)&&spec.act){spec.act(t.dataset.act,t,st);render(t.dataset.i!=null?`[data-act="${t.dataset.act}"][data-i="${t.dataset.i}"]`:`[data-act="${t.dataset.act}"]`);}
  });
  render();
}

/* ---------- quiz ---------- */
const PRAISE=['정답!','최고야!','완벽해!','바로 그거야!','수학 천재 등장!','멋지다!'];
function ansHtml(p){
  const inp=(id,cls='')=>`<input class="ans ${cls}" id="${id}" inputmode="numeric" pattern="[0-9]*" aria-label="${{ans:'답',an:'분자',ad:'분모',aw:'자연수 부분',aq:'몫',ar:'나머지'}[id]}">`;
  const go='<button class="btn" type="submit">확인</button>';
  if(p.type==='choice')return `<div class="opts">${p.opts.map((o,i)=>`<button type="button" class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
  if(p.type==='num')return `${inp('ans')}${go}`;
  if(p.type==='frac')return `<span class="frin">${inp('an','sm')}<hr>${inp('ad','sm')}</span>${go}`;
  if(p.type==='mixed')return `${inp('aw','sm')}<span class="frin">${inp('an','sm')}<hr>${inp('ad','sm')}</span>${go}`;
  if(p.type==='qr')return `<span class="qlab">몫</span>${inp('aq','sm')}<span class="qlab">나머지</span>${inp('ar','sm')}${go}`;
  if(p.type==='dec')return `<input class="ans" id="ans" inputmode="decimal" aria-label="답 (소수)">${go}`;
  if(p.type==='multi')return `${p.labels.map((l,i)=>`<input class="ans sm" id="am${i}" inputmode="numeric" pattern="[0-9]*" aria-label="${l.trim()||'답'} ${i+1}"><span class="qlab">${l}</span>`).join('')}${go}`;
}
function readAns(p,root){
  const v=id=>{const el=$('#'+id,root);const s=el?el.value.replace(/[^0-9]/g,''):'';return s===''?NaN:Number(s);};
  if(p.type==='dec'){const el=$('#ans',root);const t=el?el.value.replace(/[^0-9.]/g,''):'';if(!t||t==='.')return null;return Math.abs(Number(t)-p.a)<1e-9;}
  const ids=p.type==='multi'?p.labels.map((_,i)=>'am'+i):{num:['ans'],frac:['an','ad'],mixed:['aw','an','ad'],qr:['aq','ar']}[p.type];
  const vals=ids.map(v);
  if(vals.some(isNaN))return null;
  return p.type==='num'?vals[0]===p.a:vals.every((x,i)=>x===p.a[i]);
}
function burst(anchor){
  if(reduceMotion())return;
  const r=anchor.getBoundingClientRect(),b=document.createElement('div');
  b.className='burst';b.style.left=(r.left+30)+'px';b.style.top=(r.top+20)+'px';
  for(let i=0;i<10;i++){const s=document.createElement('i');const a=Math.random()*Math.PI*2,d=50+Math.random()*60;s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');b.appendChild(s);}
  document.body.appendChild(b);setTimeout(()=>b.remove(),900);
}
function runQuiz(root,problems,onDone){
  const st={i:0,tries:0,first:0,solved:0,locked:false};
  const draw=()=>{
    if(st.i>=problems.length){CUR.p=null;refreshAsk();onDone(st,problems.length);return;}
    const p=problems[st.i];
    Object.assign(CUR,{p,idx:st.i+1,total:problems.length,tries:0,locked:false});refreshAsk();
    root.innerHTML=`<div class="qcard" id="qcard"><div class="qtop"><span>문제 ${st.i+1} / ${problems.length}</span><button type="button" class="askq" data-ask>${face('semi','happy')}셈이에게 물어보기</button><span class="pips">${problems.map((_,j)=>`<i class="${j<st.i?'done':j===st.i?'now':''}"></i>`).join('')}</span></div><div class="qtext">${p.q}</div><form class="qans" id="qform" autocomplete="off">${ansHtml(p)}</form><div class="fb" id="fb" aria-live="polite"></div><div class="row" id="qnext"></div></div>`;
    $('#qform',root).addEventListener('submit',e=>{e.preventDefault();submit();});
    root.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>submit(+b.dataset.i,b)));
    $('[data-ask]',root).addEventListener('click',()=>openAsk());
  };
  function submit(choice,btn){
    if(st.locked)return;
    const p=problems[st.i],fb=$('#fb',root);
    let ok;
    if(p.type==='choice')ok=choice===p.a;
    else{ok=readAns(p,root);if(ok===null){fb.className='fb warn';fb.textContent='빈칸에 숫자를 모두 써 줘!';return;}}
    if(ok){
      if(st.tries===0)st.first++;st.solved++;st.locked=true;
      if(btn)btn.classList.add('right');
      fb.className='fb ok';fb.innerHTML=`<b>${pick(PRAISE)}</b>${p.ex}`;burst(fb);finish();
    }else{
      st.tries++;CUR.tries=st.tries;
      if(btn){btn.classList.add('wrong');btn.disabled=true;}
      if(st.tries===1){fb.className='fb hint';fb.innerHTML=`<b>앗, 다시 생각해 볼까?</b>셈이의 힌트: ${p.hint}`;}
      else{st.locked=true;fb.className='fb bad';fb.innerHTML=`<b>정답은 ${p.show}</b>${p.ex}`;if(p.type==='choice')root.querySelectorAll('.opt')[p.a].classList.add('right');finish();}
    }
  }
  function finish(){
    CUR.tries=st.tries;CUR.locked=true;refreshAsk();
    root.querySelectorAll('#qform input, #qform button').forEach(x=>x.disabled=true);
    const b=document.createElement('button');b.type='button';b.className='btn';
    b.textContent=st.i===problems.length-1?'결과 보기':'다음 문제';
    b.addEventListener('click',()=>{st.i++;st.tries=0;st.locked=false;draw();const c=$('#qcard',root)||root;c.scrollIntoView({block:'start',behavior:reduceMotion()?'auto':'smooth'});const f=root.querySelector('#qform input, .opt');if(f)f.focus({preventScroll:true});});
    $('#qnext',root).appendChild(b);b.focus({preventScroll:true});
  }
  draw();
}

function resultHtml(L,st,total){
  const stars=st.first===total?3:st.first>=Math.ceil(total*.6)?2:1;

  const msg=stars===3?'한 번에 다 맞혔어! 너 진짜 수학 천재구나!':stars===2?'아주 잘했어! 틀린 문제는 힌트를 떠올리며 다시 풀어 보자.':'끝까지 풀었구나! 만화와 해 보기를 다시 보고 도전하면 별이 늘어날 거야.';
  return `<div class="qcard result"><h3>${L.t} 완료!</h3><div class="stars" aria-label="별 ${stars}개">${[1,2,3].map(n=>STAR(stars>=n)).join('')}</div><p>첫 번째에 맞힌 문제 ${st.first} / ${total}</p><div class="say">${face('semi',stars===3?'wow':'happy')}<p class="bub">${msg}</p></div><div class="row"><button type="button" class="btn ghost" id="again">다시 도전</button>${navNext(L)}</div></div>`;
}

function plain(html){
  const d=document.createElement('div');d.innerHTML=String(html);
  d.querySelectorAll('.mx').forEach(m=>{const w=m.firstChild?m.firstChild.textContent:'';const f=m.querySelector('.fr');const s=f?f.children:[];m.replaceWith(` ${w}과 ${s[1]?s[1].textContent:''}분의 ${s[0]?s[0].textContent:''} `);});
  d.querySelectorAll('.fr').forEach(f=>{const s=f.children;f.replaceWith(` ${s[1].textContent}분의 ${s[0].textContent}(${s[0].textContent}/${s[1].textContent}) `);});
  d.querySelectorAll('svg,table,.candies,.gems').forEach(g=>{const l=g.getAttribute('aria-label');g.replaceWith(l?` [그림: ${l}] `:' ');});
  d.querySelectorAll('.qwho').forEach(q=>q.prepend('뚱땅이의 말: '));
  d.querySelectorAll('p,div,li').forEach(e=>e.append(' '));
  return d.textContent.replace(/\s+/g,' ').trim();
}
function contextText(){
  const L=CUR.lesson;const lines=[`- 보고 있는 곳: ${CUR.place}`,`- 학년: ${CUR.grade?`${CUR.grade}학년 (Lv.${CUR.grade})`:'아직 고르지 않음'}`];
  if(L&&L.goal)lines.push(`- 오늘의 목표: ${L.goal}`);
  const p=CUR.p;
  if(p){
    lines.push(`- 문제 ${CUR.idx}/${CUR.total}: ${plain(p.q)}`);
    if(p.type==='choice')lines.push(`- 보기: ${p.opts.map((o,i)=>`${i+1}) ${plain(o)}`).join(', ')}`);
    lines.push(`- 상태: ${CUR.locked?'풀이 끝':`풀이 중 (지금까지 ${CUR.tries}번 틀림)`}`);
    lines.push(`- 정답(참고용${CUR.locked?'':', 풀이 중이니 절대 말하지 말 것'}): ${plain(p.show)}`);
    lines.push(`- 앱의 힌트: ${plain(p.hint)}`);
    lines.push(`- 앱의 풀이${CUR.locked?'':'(참고용, 말하지 말 것)'}: ${plain(p.ex)}`);
  }else lines.push('- 지금은 문제를 풀고 있지 않아.');
  return lines.join('\n');
}

  [/(최대공약수)/,'두 수의 공통인 약수 중에서 가장 큰 수가 최대공약수야. 12와 18의 공약수는 1, 2, 3, 6이니까 최대공약수는 6!'],
  [/(약분|기약)/,'약분은 분모와 분자를 같은 수로 나누는 거야. 크기는 그대로! 더 이상 나눌 수 없으면 기약분수야.'],
  [/(통분)/,'통분은 분모가 다른 분수의 분모를 같게 만드는 거야. 두 분모의 최소공배수를 공통분모로 쓰면 편해.'],
  [/(소수점|소수)/,'소수는 1보다 작은 부분을 점(소수점) 뒤에 쓰는 수야. 0.1은 10칸 중 1칸, 0.01은 100칸 중 1칸! 계산할 땐 소수점끼리 줄을 맞춰.'],
  [/(백분율|퍼센트|%)/,'백분율은 기준량을 100으로 볼 때의 비율이야. 비율에 100을 곱하고 %를 붙이면 돼. 0.4는 40%!'],
  [/(비율|비례|: )/,'비는 두 수를 "몇 대 몇"으로 비교한 거야. 비의 앞과 뒤에 같은 수를 곱해도 비율은 같아. 비례배분은 전체를 비의 합으로 나눠서 나눠 주는 거야.'],
  [/(원주|원의 넓이|반지름|지름)/,'원주는 지름 × 3.14, 원의 넓이는 반지름 × 반지름 × 3.14야. 지름은 반지름의 2배!'],
  [/(부피|겉넓이|직육면체)/,'직육면체의 부피는 가로 × 세로 × 높이야. 겉넓이는 서로 다른 세 면의 넓이를 더해서 2배 하면 돼.'],
  [/(시계|시각|몇 시|몇 분|긴바늘|짧은바늘)/,'짧은바늘은 "몇 시", 긴바늘은 "몇 분"을 알려 줘. 긴바늘이 숫자 한 칸 움직이면 5분이고, 한 바퀴 돌면 60분 = 1시간이야.'],
  [/(받아올림|받아내림|빌려)/,'일의 자리끼리 더해서 10이 넘으면 10을 십의 자리로 1만큼 올려 줘(받아올림). 뺄 수 없으면 십의 자리에서 10을 빌려 와(받아내림).'],
  [/(혼합|계산 순서|괄호)/,'계산 순서는 괄호 안 → 곱셈과 나눗셈(앞에서부터) → 덧셈과 뺄셈(앞에서부터)이야.'],
  [/(분수|조각)/,'분수는 전체를 똑같이 나눈 것 중 몇 개인지 나타내는 수야. 똑같이 나눴는지가 제일 중요해!'],
  [/(덧셈|더하기|뺄셈|빼기|\+)/,'분모가 같은 분수는 분모는 그대로 두고 분자끼리만 더하거나 빼. 조각을 모아도 조각 크기는 그대로거든!']
];
function offlineReply(q){
  const p=CUR.p;
  if(p&&/(힌트|모르겠|어떻게|시작|도와)/.test(q))return CUR.locked?`이 문제는 이렇게 풀어. ${plain(p.ex)}`:`힌트야! ${plain(p.hint)}`;
  if(p&&CUR.locked&&/(왜|이유|답)/.test(q))return `풀이를 같이 볼까? ${plain(p.ex)}`;
  if(p&&!CUR.locked&&/(답|정답)/.test(q))return `정답은 네가 직접 찾아야 더 똑똑해져! 대신 힌트를 줄게. ${plain(p.hint)}`;
  if(/(비슷|문제 내|또)/.test(q))return '"다시 도전"을 누르면 숫자가 바뀐 새 문제가 나와! 대장 문제에서는 여러 화의 문제가 섞여서 나와.';
  if(p&&/(뜻|무슨)/.test(q))return `문제를 천천히 다시 읽어 보자. ${plain(p.q)} 무엇을 구하라고 하는지 먼저 찾아봐!`;
  for(const [re,a] of FAQ)if(re.test(q))return a;
  if(p&&!CUR.locked)return `좋은 질문이야! 우선 이 힌트부터 생각해 볼까? ${plain(p.hint)}`;
  return '음, 그 질문은 내가 아직 잘 몰라. "분모", "나머지", "올림" 같은 말을 넣어서 다시 물어봐 줄래?';
}
function askMsg(who,text,wait){
  const log=$('#askLog'),m=document.createElement('div');
  m.className='msg '+who;
  const b=document.createElement('div');b.className='mb'+(wait?' wait':'');b.textContent=text;
  if(who==='semi')m.innerHTML=face('semi','happy');
  m.appendChild(b);log.appendChild(m);log.scrollTop=log.scrollHeight;return b;
}
function refreshAsk(){
  if(!ASK.open)return;
  const p=CUR.p;
  $('#askCtx').textContent=`지금 보는 곳: ${CUR.place}${p?` · 문제 ${CUR.idx}${CUR.locked?' (풀이 끝)':''}`:''}`;
  const chips=p?(CUR.locked?['왜 이게 답이야?','다른 방법도 있어?','비슷한 문제 내 줘']:['힌트 줘','어디서부터 시작해?','이 문제 무슨 뜻이야?']):['분모랑 분자가 뭐야?','나머지는 왜 작아야 해?','올림이 뭐야?'];
  $('#askChips').innerHTML=chips.map(c=>`<button type="button">${c}</button>`).join('');
}
function setAskMode(){$('#askMode').textContent=ASK.mode==='ai'?'AI 셈이 · 질문하면 생각해서 대답해요':'기본 도움말 · 낱말로 물어보면 알려 줘요';}
function openAsk(){
  ASK.open=true;$('#askPanel').hidden=false;$('#askFab').hidden=true;$('#askFab').setAttribute('aria-expanded','true');
  if(!$('#askLog').children.length)askMsg('semi','안녕! 나는 셈이야. 문제를 풀다가 막히면 뭐든 물어봐. 정답을 바로 알려 주지는 않지만, 네가 풀 수 있게 꼭 도와줄게!');
  refreshAsk();setAskMode();$('#askIn').focus();
}
function closeAsk(){
  if(ASK.ctl)ASK.ctl.abort();
  ASK.open=false;$('#askPanel').hidden=true;$('#askFab').hidden=false;$('#askFab').setAttribute('aria-expanded','false');$('#askFab').focus();
}
function askBusy(on){ASK.busy=on;$('#askGo').hidden=on;$('#askStop').hidden=!on;$('#askIn').disabled=on;if(!on)$('#askIn').focus();}
async function askSend(raw){
  const text=String(raw||'').trim().slice(0,200);
  if(!text||ASK.busy)return;
  askMsg('kid',text);$('#askIn').value='';
  if(ASK.mode!=='ai'||!ASK.sample){askMsg('semi',offlineReply(text));return;}
  const bubble=askMsg('semi','셈이가 생각하는 중…',true);
  const ctl=ASK.ctl=new AbortController();askBusy(true);
  const input=[{role:'user',content:ASK_RULES},...ASK.turns.slice(-8),{role:'user',content:`[지금 화면]\n${contextText()}\n\n[아이의 질문]\n${text}`}];
  try{
    const r=await ASK.sample(input,{modelTier:'quick',cache:false,signal:ctl.signal,onText:({text:t})=>{bubble.classList.remove('wait');bubble.textContent=t;$('#askLog').scrollTop=$('#askLog').scrollHeight;}});
    bubble.classList.remove('wait');bubble.textContent=r.text;
    ASK.turns.push({role:'user',content:text},{role:'assistant',content:r.text});
  }catch(e){
    const code=e&&e.code,kept=e&&e.text?e.text+'\n\n':'';
    bubble.classList.remove('wait');
    if(code==='cancelled')bubble.textContent=e.text||'(멈췄어)';
    else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){ASK.mode='offline';setAskMode();bubble.textContent=offlineReply(text)+'\n\n(지금은 AI 셈이를 쓸 수 없어서 기본 도움말로 대답했어.)';}
    else if(code==='rate_limited')bubble.textContent=kept+'질문이 많아서 셈이가 잠깐 쉬어야 해. 조금 있다가 다시 물어봐 줘.';
    else if(code==='session_expired')bubble.textContent='다시 로그인해야 셈이가 대답할 수 있어. 부모님께 도와 달라고 해 줘.';
    else if(code==='refused')bubble.textContent='그 이야기는 내가 도와주기 어려워. 수학 문제로 돌아가 볼까?';
    else bubble.textContent=kept+'앗, 연결이 잠깐 끊겼어. 다시 보내 줄래?';
  }finally{if(ASK.ctl===ctl)ASK.ctl=null;askBusy(false);}
}
document.querySelectorAll('.ask-face').forEach(s=>s.innerHTML=face('semi','happy'));
$('#askFab').addEventListener('click',openAsk);
$('#askClose').addEventListener('click',closeAsk);
$('#askStop').addEventListener('click',()=>{if(ASK.ctl)ASK.ctl.abort();});
$('#askForm').addEventListener('submit',e=>{e.preventDefault();askSend($('#askIn').value);});
$('#askChips').addEventListener('click',e=>{const b=e.target.closest('button');if(b)askSend(b.textContent);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ASK.open)closeAsk();});
(async()=>{try{if(window.claude&&typeof claude.use==='function'){const s=await claude.use('sample');if(s){ASK.sample=s;ASK.mode='ai';setAskMode();}}}catch(e){}})();

function route(){
  const h=decodeURIComponent(location.hash.slice(1))||'home';
  const L=LESSONS.find(l=>l.id===h);
  const boss=h.endsWith('-boss')&&R[h.slice(0,-5)]?h.slice(0,-5):null;
  const gm=/^g([1-6])$/.exec(h),gr=L?R[L.r].g:boss?R[boss].g:gm?+gm[1]:(P.grade||0);
  CUR={place:L?`${gr}학년 ${R[L.r].name} ${lessonsOf(L.r).indexOf(L)+1}화 "${L.t}"`:boss?`${gr}학년 ${R[boss].name} 대장 문제`:gm?`${gr}학년 지도`:'모험 지도',grade:gr,lesson:L||(boss?{goal:`${R[boss].name}에서 배운 내용을 섞은 대장 문제`}:null),p:null,idx:0,total:0,tries:0,locked:false};
  if(L)renderLesson(L);else if(boss)renderBoss(boss);else if(gm)renderGrade(+gm[1]);else renderHome();
  updateHeader();refreshAsk();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
syncInit();
</script>
